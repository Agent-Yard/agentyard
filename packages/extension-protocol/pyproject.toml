[project]
name = "agentyard-extension-protocol"
version = "0.1.0"
description = "Shared AgentYard extension protocol schema assets"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "json-schema",
    "openapi",
    "src/agentyard_extension_protocol",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentyard_extension_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"json-schema" = "agentyard_extension_protocol/json_schema"
