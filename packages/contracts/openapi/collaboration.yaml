      - $ref: '#/components/schemas/UPDATECommand'
      - $ref: '#/components/schemas/TRANSITIONCommand'
      - $ref: '#/components/schemas/SET_PARTICIPANTCommand'
      - $ref: '#/components/schemas/REMOVE_PARTICIPANTCommand'
      - $ref: '#/components/schemas/PUT_CONTEXTCommand'
      - $ref: '#/components/schemas/SET_CONTEXT_STATECommand'
      - $ref: '#/components/schemas/CREATE_CHILDCommand'
