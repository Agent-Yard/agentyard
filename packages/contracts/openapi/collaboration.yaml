openapi: 3.1.0
info:
  title: AgentYard Task Collaboration API
  version: 1.0.0
servers:
- url: /api
paths:
  /collaboration/actors/me:
    get:
      summary: Resolve and register the authenticated human actor
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Actor'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /collaboration/actors:
    get:
      summary: Search the active actor directory (up to 100)
      tags:
      - Task collaboration
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actor'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /collaboration/actors/agents:
    post:
      summary: Register an existing catalog Agent as an actor without granting permissions
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Actor'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentActor'
  /collaboration/organizations:
    get:
      summary: List organizations where the current actor is a member
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
    post:
      summary: Create an organization with configurable roles
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
  /collaboration/organizations/{id}:
    get:
      summary: Read an organization and its scoped members
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
    put:
      summary: Update organization roles and metadata at expected revision
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
  /collaboration/organizations/{id}/members:
    put:
      summary: Set member roles; an empty list removes membership
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMember'
  /collaboration/tasks:
    get:
      summary: List tasks the authenticated actor participates in
      tags:
      - Task collaboration
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TaskPage'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
    post:
      summary: Create a persistent unit of collaborative work
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Task'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
  /collaboration/tasks/{id}:
    get:
      summary: Read task detail with filtered context and redacted execution results
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TaskDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /collaboration/tasks/{id}/commands:
    post:
      summary: Apply one scoped atomic task command
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CommandResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommand'
  /collaboration/tasks/{id}/context:
    get:
      summary: Page through visible task context
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ContextEntryPage'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /collaboration/tasks/{id}/context/{entryId}/versions:
    get:
      summary: Read up to 100 visible historical entry versions
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: entryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextEntry'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /collaboration/tasks/{id}/events:
    get:
      summary: Read reference-only task events after a revision
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: afterRevision
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /collaboration/sessions/{sessionId}/tasks:
    get:
      summary: List tasks explicitly linked by the current actor to this session
      tags:
      - Task collaboration
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
  /internal/task-executions/{id}:
    get:
      summary: Read currently authorized execution and frozen input snapshot
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionInput'
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      security:
      - InternalBearer: []
  /internal/task-executions/{id}/progress:
    post:
      summary: Persist execution progress without overriding a terminal outcome
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      security:
      - InternalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionProgress'
  /internal/task-executions/{id}/commands:
    post:
      summary: Contribute under the stored execution actor; only PUT_CONTEXT, SET_CONTEXT_STATE, CREATE_CHILD
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      security:
      - InternalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommand'
  /internal/task-sessions/{sessionId}:
    get:
      summary: List linked tasks visible to both customer and current Agent
      tags:
      - Task collaboration
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: agentId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      security:
      - InternalBearer: []
  /internal/task-sessions/{sessionId}/tasks/{taskId}/context:
    get:
      summary: Read the intersection of human and Agent context scopes
      tags:
      - Task collaboration
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      - name: agentId
        in: query
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextEntryPage'
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, dependency, review, waiting or idempotency conflict
      security:
      - InternalBearer: []
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
  schemas:
    Permission:
      type: string
      enum:
      - VIEW
      - CONTRIBUTE
      - DECIDE
      - EXECUTE
      - REVIEW
      - MANAGE
    TaskStatus:
      type: string
      enum:
      - OPEN
      - ACTIVE
      - WAITING
      - IN_REVIEW
      - COMPLETED
      - CANCELLED
    ContextKind:
      type: string
      enum:
      - FACT
      - HYPOTHESIS
      - PROPOSAL
      - DECISION
      - QUESTION
      - NOTE
      - SUMMARY
      - ARTIFACT
    ContextState:
      type: string
      enum:
      - PROPOSED
      - CONFIRMED
      - RESOLVED
      - REJECTED
      - SUPERSEDED
    RelationKind:
      type: string
      enum:
      - CHILD
      - DEPENDS_ON
      - RELATED
    ExecutionStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - WAITING
      - SUCCEEDED
      - FAILED
      - CANCELLED
    Actor:
      type: object
      required:
      - id
      - kind
      - subjectId
      - displayName
      - active
      - createdAt
      properties:
        id:
          type: string
        kind:
          enum:
          - HUMAN
          - AGENT
        subjectId:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required:
      - key
      - name
      - permissions
      properties:
        key:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Participant:
      type: object
      required:
      - actorId
      - roles
      properties:
        actorId:
          type: string
        roles:
          type: array
          items:
            type: string
    Policy:
      type: object
      required:
      - roles
      - requiredApprovals
      - allowSelfReview
      - acceptanceCriteria
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        requiredApprovals:
          type: integer
          minimum: 0
          maximum: 100
        allowSelfReview:
          type: boolean
        acceptanceCriteria:
          type: array
          items:
            type: string
    Organization:
      type: object
      required:
      - id
      - parentId
      - name
      - description
      - roles
      - revision
      - createdBy
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        parentId:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        revision:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationDetail:
      type: object
      required:
      - organization
      - members
      - permissions
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Task:
      type: object
      required:
      - id
      - organizationId
      - title
      - goal
      - status
      - stage
      - revision
      - contentRevision
      - attributes
      - policy
      - createdBy
      - submittedBy
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        organizationId:
          anyOf:
          - type: string
          - type: 'null'
        title:
          type: string
        goal:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        stage:
          type: string
        revision:
          type: integer
        contentRevision:
          type: integer
        attributes:
          type: object
        policy:
          $ref: '#/components/schemas/Policy'
        createdBy:
          type: string
        submittedBy:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContextEntry:
      type: object
      required:
      - id
      - taskId
      - kind
      - title
      - body
      - state
      - visibleToRoles
      - source
      - authorId
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        taskId:
          type: string
        kind:
          $ref: '#/components/schemas/ContextKind'
        title:
          type: string
        body:
          type: object
        state:
          $ref: '#/components/schemas/ContextState'
        visibleToRoles:
          type: array
          items:
            type: string
        source:
          type: object
        authorId:
          type: string
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Relation:
      type: object
      required:
      - taskId
      - relatedTaskId
      - kind
      properties:
        taskId:
          type: string
        relatedTaskId:
          type: string
        kind:
