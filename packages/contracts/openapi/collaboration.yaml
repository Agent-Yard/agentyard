        propertyName: kind
        mapping:
          UPDATE: '#/components/schemas/UPDATECommand'
          TRANSITION: '#/components/schemas/TRANSITIONCommand'
          SET_PARTICIPANT: '#/components/schemas/SET_PARTICIPANTCommand'
          REMOVE_PARTICIPANT: '#/components/schemas/REMOVE_PARTICIPANTCommand'
          PUT_CONTEXT: '#/components/schemas/PUT_CONTEXTCommand'
          SET_CONTEXT_STATE: '#/components/schemas/SET_CONTEXT_STATECommand'
          CREATE_CHILD: '#/components/schemas/CREATE_CHILDCommand'
          LINK_TASK: '#/components/schemas/LINK_TASKCommand'
          UNLINK_TASK: '#/components/schemas/UNLINK_TASKCommand'
          LINK_SESSION: '#/components/schemas/LINK_SESSIONCommand'
          UNLINK_SESSION: '#/components/schemas/UNLINK_SESSIONCommand'
          REVIEW: '#/components/schemas/REVIEWCommand'
          START_EXECUTION: '#/components/schemas/START_EXECUTIONCommand'
          CANCEL_EXECUTION: '#/components/schemas/CANCEL_EXECUTIONCommand'
          RESUME_EXECUTION: '#/components/schemas/RESUME_EXECUTIONCommand'
