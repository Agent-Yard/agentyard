openapi: 3.1.0
info:
  title: AgentYard Task Collaboration API
  version: 2.0.0
  description: Persistent human and Agent-instance participants coordinate work. Tasks hold shared information; authorized
    participants make decisions. Agent tools call the same business services with server-bound identity and current source-message
    provenance.
servers:
- url: /api
paths:
  /collaboration/actors/me:
    get:
      summary: Resolve and register the authenticated human actor
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Actor'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/actors:
    get:
      summary: Search the active actor directory (up to 100)
      tags:
      - Task collaboration
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actor'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/organizations:
    get:
      summary: List organizations where the current actor is a member
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
    post:
      summary: Create an organization with configurable roles
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
  /collaboration/organizations/{id}:
    get:
      summary: Read an organization and its scoped members
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
    put:
      summary: Update organization roles and metadata at expected revision
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
  /collaboration/organizations/{id}/members:
    put:
      summary: Set member roles; an empty list removes membership
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrganizationDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMember'
  /collaboration/tasks:
    get:
      summary: List tasks the authenticated actor participates in
      tags:
      - Task collaboration
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TaskPage'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
    post:
      summary: Create a persistent unit of collaborative work
      tags:
      - Task collaboration
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Task'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
  /collaboration/tasks/{id}:
    get:
      summary: Read task detail with filtered context and redacted execution results
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TaskDetail'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/tasks/{id}/commands:
    post:
      summary: Apply one scoped atomic task command
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CommandResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommand'
  /collaboration/tasks/{id}/context:
    get:
      summary: Page through visible task context
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ContextEntryPage'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/tasks/{id}/context/{entryId}/versions:
    get:
      summary: Read up to 100 visible historical entry versions
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: entryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextEntry'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/tasks/{id}/events:
    get:
      summary: Read reference-only task events after a revision
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: afterRevision
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/sessions/{sessionId}/tasks:
    get:
      summary: List tasks explicitly linked by the current actor to this session
      tags:
      - Task collaboration
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
  /collaboration/tasks/{id}/decisions:
    get:
      summary: Read decisions newest first, including older pages with a stable cursor
      tags:
      - Task collaboration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DecisionPage'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid command or policy
        '401':
          description: Authentication required
        '403':
          description: Actor lacks scoped permission
        '404':
          description: Object not found in the accessible scope
        '409':
          description: Revision, lifecycle, graph or idempotency conflict; reread the current authorized object before reconciling.
components:
  schemas:
    Permission:
      type: string
      enum:
      - VIEW
      - CONTRIBUTE
      - DECIDE
      - EXECUTE
      - MANAGE
    TaskStatus:
      type: string
      enum:
      - OPEN
      - ACTIVE
      - WAITING
      - PAUSED
      - SUBMITTED
      - COMPLETED
      - CANCELLED
    ContextKind:
      type: string
      enum:
      - FACT
      - HYPOTHESIS
      - PROPOSAL
      - DECISION
      - QUESTION
      - NOTE
      - SUMMARY
      - ARTIFACT
    ContextState:
      type: string
      enum:
      - PROPOSED
      - CONFIRMED
      - RESOLVED
      - REJECTED
      - SUPERSEDED
    RelationKind:
      type: string
      enum:
      - CHILD
      - DEPENDS_ON
      - RELATED
    Actor:
      type: object
      required:
      - id
      - kind
      - subjectId
      - displayName
      - active
      - createdAt
      properties:
        id:
          type: string
        kind:
          enum:
          - HUMAN
          - AGENT
        subjectId:
          type: string
          description: For AGENT, the concrete persistent Session ID. A role template is never an actor. For HUMAN, the trusted
            platform or namespaced external identity.
        displayName:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required:
      - key
      - name
      - permissions
      properties:
        key:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Participant:
      type: object
      required:
      - actorId
      - roles
      properties:
        actorId:
          type: string
        roles:
          type: array
          items:
            type: string
    Policy:
      type: object
      required:
      - roles
      - acceptanceCriteria
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        acceptanceCriteria:
          type: array
          items:
            type: string
    Organization:
      type: object
      required:
      - id
      - parentId
      - name
      - description
      - roles
      - revision
      - createdBy
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        parentId:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        revision:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationDetail:
      type: object
      required:
      - organization
      - members
      - permissions
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Task:
      type: object
      required:
      - id
      - organizationId
      - title
      - goal
      - status
      - stage
      - revision
      - contentRevision
      - attributes
      - policy
      - createdBy
      - submittedBy
      - createdAt
      - updatedAt
      - initiatedBy
      - confirmerId
      properties:
        id:
          type: string
        organizationId:
          anyOf:
          - type: string
          - type: 'null'
        title:
          type: string
        goal:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        stage:
          type: string
        revision:
          type: integer
        contentRevision:
          type: integer
        attributes:
          type: object
        policy:
          $ref: '#/components/schemas/Policy'
        createdBy:
          type: string
        submittedBy:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        initiatedBy:
          type: string
        confirmerId:
          type: string
    ContextEntry:
      type: object
      required:
      - id
      - taskId
      - kind
      - title
      - body
      - state
      - visibleToRoles
      - source
      - authorId
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        taskId:
          type: string
        kind:
          $ref: '#/components/schemas/ContextKind'
        title:
          type: string
        body:
          type: object
        state:
          $ref: '#/components/schemas/ContextState'
        visibleToRoles:
          type: array
          items:
            type: string
        source:
          type: object
        authorId:
          type: string
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Relation:
      type: object
      required:
      - taskId
      - relatedTaskId
      - kind
      properties:
        taskId:
          type: string
        relatedTaskId:
          type: string
        kind:
          $ref: '#/components/schemas/RelationKind'
    SessionLink:
      type: object
      required:
      - taskId
      - sessionId
      - actorId
      - createdAt
      properties:
        taskId:
          type: string
        sessionId:
          type: string
        actorId:
          type: string
        createdAt:
          type: string
          format: date-time
    TaskDetail:
      type: object
      required:
      - task
      - participants
      - context
      - relations
      - sessions
      - permissions
      - decisions
      properties:
        task:
          $ref: '#/components/schemas/Task'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        context:
          type: array
          items:
            $ref: '#/components/schemas/ContextEntry'
          description: A bounded preview. Use /context for complete paginated content.
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionLink'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
          description: The latest 200 decisions in chronological order; use /decisions for complete paginated history.
    Event:
      type: object
      required:
      - taskId
      - revision
      - actorId
      - kind
      - data
      - visibleToRoles
      - createdAt
      properties:
        taskId:
          type: string
        revision:
          type: integer
        actorId:
          type: string
        kind:
          type: string
        data:
          type: object
        visibleToRoles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    TaskPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
    ContextEntryPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContextEntry'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
    CreateTask:
      type: object
      required:
      - title
      - goal
      properties:
        organizationId:
          anyOf:
          - type: string
          - type: 'null'
        title:
          type: string
        goal:
          type: string
        attributes:
          type: object
        policy:
          $ref: '#/components/schemas/Policy'
    CreateOrganization:
      type: object
      required:
      - name
      properties:
        parentId:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    UpdateOrganization:
      type: object
      required:
      - expectedRevision
      - name
      - description
      - roles
      properties:
        expectedRevision:
          type: integer
        name:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    SetMember:
      type: object
      required:
      - expectedRevision
      - actorId
      - roles
      properties:
        expectedRevision:
          type: integer
        actorId:
          type: string
        roles:
          type: array
          items:
            type: string
    CommandResult:
      type: object
      required:
      - taskId
      - revision
      - objectId
      - duplicate
      - status
      - contentRevision
      - submissionInvalidated
      properties:
        taskId:
          type: string
        revision:
          type: integer
        objectId:
          anyOf:
          - type: string
          - type: 'null'
        duplicate:
          type: boolean
        status:
          $ref: '#/components/schemas/TaskStatus'
        contentRevision:
          type: integer
          format: int64
        submissionInvalidated:
          type: boolean
          description: This command changed shared material after submission; submit the current content again when ready for confirmation.
    TaskCommand:
      type: object
      required:
      - requestId
      - expectedRevision
      - kind
      - data
      properties:
        requestId:
          type: string
          minLength: 1
          description: Idempotency key scoped to task and actual caller. Reusing it with different input conflicts.
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum:
          - UPDATE
          - TRANSITION
          - SET_PARTICIPANT
          - REMOVE_PARTICIPANT
          - PUT_CONTEXT
          - SET_CONTEXT_STATE
          - CREATE_CHILD
          - LINK_TASK
          - UNLINK_TASK
          - LINK_SESSION
          - UNLINK_SESSION
          - SUBMIT
          - CONFIRM
          - REQUEST_CHANGES
          - CONFIRM_STAGE
          - TRANSFER_CONFIRMATION
        data:
          type: object
          additionalProperties: true
          description: 'Command-specific parameters. TRANSITION: status; SET_PARTICIPANT: actorId,roles; PUT_CONTEXT: kind,title,body,visibleToRoles,source
            and optional entryId/entryRevision. SUBMIT records an execution participant delivery. CONFIRM/REQUEST_CHANGES/CONFIRM_STAGE
            require contentRevision and optional comment. TRANSFER_CONFIRMATION requires participantId. Only the designated
            confirmer can make final/stage/transfer decisions. Completed work requires an explicit authorized reopen. Parent/child
            completion is not a universal approval gate.'
    Decision:
      type: object
      required:
      - id
      - taskId
      - contentRevision
      - kind
      - decidedBy
      - executedBy
      - comment
      - createdAt
      properties:
        id:
          type: string
        taskId:
          type: string
        contentRevision:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - SUBMIT
          - CONFIRM
          - REQUEST_CHANGES
          - CONFIRM_STAGE
          - TRANSFER_CONFIRMATION
          - PAUSE
          - RESUME
          - CANCEL
        decidedBy:
          type: string
          description: The actual authorized decision maker; a human proxy instruction remains a human decision.
        executedBy:
          type: string
          description: The participant who executed the operation, including the proxy Agent instance.
        sourceMessageId:
          type:
          - string
          - 'null'
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
    DecisionPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
