      description: Atomic, optimistic and idempotent task mutation. Reconcile current revision after 409. PUT_CONTEXT creates
        when entryId is absent (kind required); edits require entryRevision and retain audience. Role/context/dependency changes
          invalidate content reviews. See docs/architecture/code-framework.md.
