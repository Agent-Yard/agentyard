      - $ref: '#/components/schemas/UNLINK_TASKCommand'
      - $ref: '#/components/schemas/LINK_SESSIONCommand'
      - $ref: '#/components/schemas/UNLINK_SESSIONCommand'
      - $ref: '#/components/schemas/REVIEWCommand'
      - $ref: '#/components/schemas/START_EXECUTIONCommand'
      - $ref: '#/components/schemas/CANCEL_EXECUTIONCommand'
      - $ref: '#/components/schemas/RESUME_EXECUTIONCommand'
