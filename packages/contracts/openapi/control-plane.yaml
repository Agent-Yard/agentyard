openapi: 3.1.0
info:
  title: AgentYard Agent Control Plane API
  version: 1.0.0
servers:
- url: http://127.0.0.1:8080/api
paths:
  /collaboration/actors/me:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1actors~1me
  /collaboration/actors:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1actors
  /collaboration/organizations:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1organizations
  /collaboration/organizations/{id}:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1organizations~1{id}
  /collaboration/organizations/{id}/members:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1organizations~1{id}~1members
  /collaboration/tasks:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1tasks
  /collaboration/tasks/{id}:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1tasks~1{id}
  /collaboration/tasks/{id}/commands:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1tasks~1{id}~1commands
  /collaboration/tasks/{id}/context:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1tasks~1{id}~1context
  /collaboration/tasks/{id}/context/{entryId}/versions:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1tasks~1{id}~1context~1{entryId}~1versions
  /collaboration/tasks/{id}/events:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1tasks~1{id}~1events
  /collaboration/sessions/{sessionId}/tasks:
    $ref: ./collaboration.yaml#/paths/~1collaboration~1sessions~1{sessionId}~1tasks
  /auth/login:
    get:
      summary: Start OIDC login flow
      responses:
        '302':
          description: Redirect to the configured OIDC authorization endpoint
  /auth/logout:
    post:
      summary: Logout current platform session
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogoutResponse'
  /auth/session:
    get:
      summary: Get current platform user session
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserSession'
        '401':
          description: Authentication required
  /catalog/summary:
    get:
      summary: Read configuration catalog within the current user’s ownership scope
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCatalogSummary'
        '403':
          description: Not authorized for this operation or object
        '409':
          description: Revision conflict or immutable published version
  /extensions/channel-providers:
    get:
      summary: List registered channel provider definitions
      responses:
        '200':
          description: Registered channel provider definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderDefinitionList'
        '503':
          description: Extension definition registry is not ready
  /extensions/tool-connectors:
    get:
      summary: List registered tool connector definitions
      responses:
        '200':
          description: Registered tool connector definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseToolConnectorDefinitionList'
        '503':
          description: Extension definition registry is not ready
  /internal/channel-outbound/frames/stream:
    get:
      summary: Stream channel outbound frames for one channel profile
      description: 'Internal SSE endpoint consumed by channel-gateway. The SSE id is a short-lived streamCursor for transient
        replay only. Last-Event-ID can resume recent transient frames when the replay buffer still contains that cursor, but
        it is not a durable final checkpoint. Durable final replay is driven only by X-AgentYard-Last-Acked-Final-Sequence,
        and each FINAL_DELIVERY frame data carries finalSequence.

        '
      parameters:
      - in: query
        name: channelProfileId
        required: true
        schema:
          type: string
          minLength: 1
      - in: header
        name: Last-Event-ID
        required: false
        description: Short-lived streamCursor for transient SSE replay; can expire and must not be used as lastAckedFinalSequence.
        schema:
          type: string
      - in: header
        name: X-AgentYard-Last-Acked-Final-Sequence
        required: false
        description: Durable profile-consumer checkpoint. API replays FINAL_DELIVERY frames with finalSequence greater than
          this value.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: header
        name: X-AgentYard-Last-Acked-Session-Id
        required: false
        description: Diagnostic integrity field paired with lastAckedFinalSequence; not used as the ordering key.
        schema:
          type: string
      - in: header
        name: X-AgentYard-Last-Acked-Session-Message-Id
        required: false
        description: Diagnostic integrity field paired with lastAckedFinalSequence; not used as the ordering key.
        schema:
          type: string
      - in: header
        name: X-AgentYard-Max-Final-Replay-Frames
        required: false
        description: Gateway replay credit. API must cap the number of FINAL_DELIVERY frames emitted during this connection.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: 'text/event-stream. event=channel-outbound-frame data is ChannelOutboundFrame. event=final-replay-window-exhausted
            data is ChannelOutboundFinalReplayWindowExhausted. Live idle periods may include comment-only heartbeat frames;
            clients must ignore them for Last-Event-ID replay and final checkpoint purposes.

            '
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Checkpoint headers are syntactically invalid
        '422':
          description: Checkpoint headers are semantically invalid
  /internal/channel-outbound/binding-snapshot/refresh:
    post:
      summary: Request API refresh of channel binding snapshots
      description: 'Internal hint from channel-gateway after binding/profile changes. The API must treat this as a trigger
        to refresh from channel-gateway authoritative binding/profile APIs, not as a trusted snapshot upsert body.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelOutboundBindingSnapshotRefreshRequest'
      responses:
        '202':
          description: Refresh request accepted for shared debounce and single-flight processing
        '400':
          description: Refresh request is invalid
  /channel-admin/profiles:
    get:
      summary: List channel profiles
      responses:
        '200':
          description: Channel profiles with credential material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfileList'
    post:
      summary: Create channel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelProfilePayload'
      responses:
        '200':
          description: Created channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '400':
          description: Channel profile payload is invalid
        '422':
          description: Integration account, entry, or provider config is invalid
        '503':
          description: Channel provider registry is not ready
  /channel-admin/profiles/{channelProfileId}:
    get:
      summary: Get channel profile
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel profile with credential material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '404':
          description: Channel profile not found
    put:
      summary: Update channel profile
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelProfilePayload'
      responses:
        '200':
          description: Updated channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '400':
          description: Channel profile payload is invalid
        '409':
          description: Channel profile revision conflict
        '422':
          description: Integration account, entry, or provider config is invalid
        '503':
          description: Channel provider registry is not ready
    delete:
      summary: Disable channel profile
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: query
        name: expectedRevision
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Disabled channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '400':
          description: expectedRevision is missing or invalid
        '409':
          description: Channel profile revision conflict
  /channel-admin/profiles/{channelProfileId}/bindings:
    get:
      summary: List channel conversation bindings
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel conversation bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelConversationBindingList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/inbound-events:
    get:
      summary: List channel inbound events
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel inbound events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelInboundEventList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/outbound-final-checkpoints:
    get:
      summary: List channel outbound final checkpoints
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel outbound final checkpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelOutboundFrameCheckpointList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/template-bindings:
    get:
      summary: List external template bindings for a channel profile
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: External template bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelTemplateBindingList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/template-bindings/{entryId}/{messageType}/{messageSubtype}/{messageVersion}:
    put:
      summary: Create or update an external template binding
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: path
        name: entryId
        required: true
        schema:
          type: string
      - in: path
        name: messageType
        required: true
        schema:
          type: string
      - in: path
        name: messageSubtype
        required: true
        schema:
          type: string
      - in: path
        name: messageVersion
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTemplateBindingWritePayload'
      responses:
        '200':
          description: Saved external template binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelTemplateBinding'
        '409':
          description: Template binding expectedRevision is stale
        '422':
          description: Template binding tuple or variable schema is invalid
    delete:
      summary: Disable an external template binding
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: path
        name: entryId
        required: true
        schema:
          type: string
      - in: path
        name: messageType
        required: true
        schema:
          type: string
      - in: path
        name: messageSubtype
        required: true
        schema:
          type: string
      - in: path
        name: messageVersion
        required: true
        schema:
          type: string
      - in: query
        name: expectedRevision
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Disabled external template binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelTemplateBinding'
        '404':
          description: Channel profile or template binding not found
        '409':
          description: Template binding expectedRevision is stale
  /channel-admin/profiles/{channelProfileId}/jobs:
    get:
      summary: List provider jobs for a channel profile
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Provider job configs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobConfigList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/jobs/{jobType}:
    put:
      summary: Create or update a provider job config
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: path
        name: jobType
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelProviderJobConfigWritePayload'
      responses:
        '200':
          description: Saved provider job config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobConfig'
        '409':
          description: Provider job is running or expectedRevision is stale
        '422':
          description: Provider job definition, schedule config, or job config is invalid
    delete:
      summary: Disable a provider job config
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: path
        name: jobType
        required: true
        schema:
          type: string
      - in: query
        name: expectedRevision
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Disabled provider job config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobConfig'
        '404':
          description: Channel profile or provider job not found
        '409':
          description: Provider job is running or expectedRevision is stale
        '422':
          description: Provider job definition is invalid
  /channel-admin/profiles/{channelProfileId}/jobs/{jobType}/runs:
    get:
      summary: List provider job run history
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: path
        name: jobType
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Provider job run history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobRunList'
        '404':
          description: Channel profile or provider job not found
        '422':
          description: Provider job definition is invalid
    post:
      summary: Manually run a provider job through channel-gateway
      parameters:
      - in: path
        name: channelProfileId
        required: true
        schema:
          type: string
      - in: path
        name: jobType
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Provider job run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobRun'
        '404':
          description: Channel profile or provider job not found
        '409':
          description: Provider job is already running or not active
        '422':
          description: Provider job definition is invalid
  /integration/accounts:
    get:
      summary: List integration accounts
      responses:
        '200':
          description: Integration accounts with credential state redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccountList'
    post:
      summary: Create integration account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationAccountPayload'
      responses:
        '200':
          description: Created integration account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '422':
          description: Integration account subject or config is invalid
        '503':
          description: Extension definition registry is not ready
  /integration/accounts/{accountId}:
    get:
      summary: Get integration account
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Integration account with credential state redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
    put:
      summary: Update integration account
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationAccountPayload'
      responses:
        '200':
          description: Updated integration account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '422':
          description: Integration account config is invalid
        '503':
          description: Extension definition registry is not ready
  /integration/accounts/{accountId}/status:
    put:
      summary: Update integration account status
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationAccountStatusPayload'
      responses:
        '200':
          description: Updated integration account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
  /integration/accounts/{accountId}/archive:
    post:
      summary: Archive integration account
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Archived integration account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
  /integration/accounts/{accountId}/credentials:
    post:
      summary: Create integration account credential
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationAccountCredentialPayload'
      responses:
        '200':
          description: Credential state after create, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported, invalid, or not allowed in current state
  /integration/accounts/{accountId}/credentials/rotate:
    post:
      summary: Rotate integration account credential
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateIntegrationAccountCredentialPayload'
      responses:
        '200':
          description: Credential state after rotate, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported, invalid, or not allowed in current state
  /integration/accounts/{accountId}/credentials/validate:
    post:
      summary: Validate integration account credential
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credential state after validate, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported or not allowed in current state
  /integration/accounts/{accountId}/credentials/revoke:
    post:
      summary: Revoke integration account credential
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credential state after revoke, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported or not allowed in current state
  /internal/integration/accounts/{accountId}/credential:
    get:
      summary: Internal runtime credential lookup
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Runtime credential for connector execution
  /catalog/references/{objectType}/{objectId}:
    get:
      summary: Get unified object reference analysis
      parameters:
      - in: path
        name: objectType
        required: true
        schema:
          $ref: '#/components/schemas/ReferenceObjectType'
      - in: path
        name: objectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unified reference analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectReferenceAnalysis'
  /catalog/deletion-preview/{objectType}/{objectId}:
    get:
      summary: Get deletion impact preview for a catalog object
      parameters:
      - in: path
        name: objectType
        required: true
        schema:
          $ref: '#/components/schemas/ReferenceObjectType'
      - in: path
        name: objectId
        required: true
        schema:
          type: string
      responses:
        '200':
