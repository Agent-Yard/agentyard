openapi: 3.1.0
info:
  title: Lynxus Control Plane API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api
paths:
  /auth/session:
    get:
      summary: Get current mock session
      responses:
        '200':
          description: Current session
  /auth/switch-role:
    patch:
      summary: Switch current mock role
      responses:
        '200':
          description: Updated session
  /catalog/summary:
    get:
      summary: Get aggregate catalog summary
      responses:
        '200':
          description: Aggregate catalog state
  /domains:
    get:
      summary: List business domains
    post:
      summary: Create business domain
  /scenarios:
    get:
      summary: List scenarios
    post:
      summary: Create scenario
  /scenarios/{scenarioId}:
    get:
      summary: Get scenario detail
      parameters:
        - in: path
          name: scenarioId
          required: true
          schema:
            type: string
    put:
      summary: Update scenario
      parameters:
        - in: path
          name: scenarioId
          required: true
          schema:
            type: string
  /assistants:
    get:
      summary: List assistants
    post:
      summary: Create assistant
  /assistants/{assistantId}:
    put:
      summary: Update assistant
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
  /agents:
    get:
      summary: List agents
    post:
      summary: Create agent
  /agents/{agentId}:
    get:
      summary: Get agent detail
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
    put:
      summary: Update agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
  /agents/{agentId}/bindings:
    put:
      summary: Replace agent resource bindings
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
  /resources:
    get:
      summary: List resources
    post:
      summary: Create resource
  /resources/{resourceId}/versions:
    get:
      summary: List resource versions
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
    post:
      summary: Create resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
  /resources/{resourceId}/versions/{versionId}/publish:
    patch:
      summary: Publish a resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /resource-center:
    get:
      summary: Get resource versioning, ownership, and binding overview
  /resource-blueprints:
    get:
      summary: Get resource type blueprints for knowledge bases, skills, and MCPs
  /orchestrations:
    get:
      summary: List orchestration designs for assistants
  /orchestrations/{assistantId}:
    get:
      summary: Get orchestration detail
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
    put:
      summary: Save orchestration design
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
  /resource-bindings:
    post:
      summary: Bind resource to agent
  /tasks:
    get:
      summary: List task instances
    post:
      summary: Launch task
  /runtime/sessions:
    get:
      summary: List conversation runtime sessions
      description: Returns sessions with latest task, workflow, and MCP invocation summary.
    post:
      summary: Create a conversation runtime session
  /runtime/sessions/{sessionId}:
    get:
      summary: Get conversation session detail
      description: Returns session messages plus the latest MCP invocation summary for the active conversation.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
  /runtime/sessions/{sessionId}/messages:
    post:
      summary: Send a message to a conversation session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
  /workflows:
    get:
      summary: List workflow instances
      description: Returns workflow state, node executions, resource anchors, and MCP invocation summary.
  /workflows/{workflowId}:
    get:
      summary: Get workflow detail
      description: Returns workflow state, node executions, human interventions, and MCP invocation summary.
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
  /workflows/{workflowId}/human-action:
    patch:
      summary: Handle human action
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
components:
  schemas:
    McpInvocationSummary:
      type: object
      properties:
        capabilityName:
          type: string
        externalTicketId:
          type: string
        status:
          type: string
        recommendedAction:
          type: string
        detail:
          type: string
    WorkflowInstance:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        summary:
          type: string
        escalationRequired:
          type: boolean
        mcpSummary:
          $ref: '#/components/schemas/McpInvocationSummary'
    ConversationSession:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        latestTaskId:
          type: string
          nullable: true
        latestWorkflowInstanceId:
          type: string
          nullable: true
        latestMcpSummary:
          allOf:
            - $ref: '#/components/schemas/McpInvocationSummary'
          nullable: true
