  /session-runtime/sessions:
    get:
      summary: List session runtime sessions
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionRuntimeSession'
    post:
      summary: Create a session runtime session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}:
    get:
      summary: Get session runtime detail
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeDetail'
  /session-runtime/sessions/{sessionId}/stream:
    get:
      summary: Stream session runtime updates over SSE
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: query
          name: lastEventId
          required: false
          schema:
            type: string
          description: Replay events after this SSE event id when reconnecting.
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
          description: Standard SSE reconnection header. Overrides the query parameter when both are present.
      responses:
        '200':
          description: Server-sent event stream of session snapshots and updates
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionRuntimeStreamEvent'
  /internal/session-runtime/stream-frames:
    post:
      summary: Accept an internal agent-turn stream frame for transient SSE relay
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTurnTransientFrame'
      responses:
        '200':
          description: Frame accepted
          content:
            application/json:
              schema:
                type: object
  /session-runtime/sessions/{sessionId}/messages:
    post:
      summary: Send a user message into an existing session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSessionMessageRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
        '409':
          description: Session is busy or rejected the message
  /session-runtime/sessions/{sessionId}/human-resume:
    post:
      summary: Resume a waiting playbook run with human input
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanResumeRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}/external-callback:
    post:
      summary: Resume a waiting playbook run with external callback payload
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Explicit key wins; when omitted, the server derives a stable key from sessionId, playbookRunId, and payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCallbackRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}/handoff/end:
    post:
      summary: End session human handoff mode
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}/human-reply:
    post:
      summary: Append a human operator reply during session handoff
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanOperatorReplyRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
        '409':
          description: Duplicate callback is already being processed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PlatformRole:
      type: string
      enum: [PLATFORM_ADMIN, DOMAIN_ADMIN, DEVELOPER, BUSINESS_USER]
    UserSession:
      type: object
      required: [userId, displayName, currentRole, availableRoles]
      properties:
        userId:
          type: string
        displayName:
          type: string
        currentRole:
          $ref: '#/components/schemas/PlatformRole'
        availableRoles:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRole'
    ApiResponseUserSession:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UserSession'
        timestamp:
          type: string
          format: date-time
    LogoutResponse:
      type: object
      required: [postLogoutRedirectUrl]
      properties:
        postLogoutRedirectUrl:
          type: string
    ApiResponseLogoutResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LogoutResponse'
        timestamp:
          type: string
          format: date-time
    ApiResponseChannelProviderDefinitionList:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChannelProviderDefinition'
        timestamp:
          type: string
          format: date-time
    ApiResponseToolConnectorDefinitionList:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ToolConnectorDefinition'
        timestamp:
          type: string
          format: date-time
    JsonObject:
      type: object
      additionalProperties: true
    UiField:
      type: object
      additionalProperties: true
    CredentialCapabilityMode:
      type: string
      enum: [REMOTE_LIFECYCLE, CORE_ENCRYPTED_REFERENCE]
    CredentialCapability:
      type: object
      required: [supported, credentialUiSchema]
      properties:
        supported:
          type: boolean
        mode:
          anyOf:
            - $ref: '#/components/schemas/CredentialCapabilityMode'
            - type: 'null'
        credentialSchema:
          anyOf:
            - $ref: '#/components/schemas/JsonObject'
            - type: 'null'
        credentialUiSchema:
          type: array
          items:
            $ref: '#/components/schemas/UiField'
    ChannelProviderJobDefaultSchedule:
      type: object
      additionalProperties: true
      properties:
        scheduleType:
          type: string
        intervalSeconds:
          type: integer
          nullable: true
        cronExpression:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        jobConfig:
          $ref: '#/components/schemas/JsonObject'
    ChannelProviderJobDefinition:
      type: object
      required: [jobType, title, jobConfigSchema, jobConfigUiSchema]
      properties:
        jobType:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        jobConfigSchema:
          $ref: '#/components/schemas/JsonObject'
        jobConfigUiSchema:
          type: array
          items:
            $ref: '#/components/schemas/UiField'
        defaultSchedule:
          anyOf:
            - $ref: '#/components/schemas/ChannelProviderJobDefaultSchedule'
            - type: 'null'
        defaultEnabled:
          type: boolean
          nullable: true
        defaultJobTimeoutSeconds:
          type: integer
          nullable: true
    ChannelProviderDefinition:
      type: object
      required:
        - providerType
        - title
        - definitionDigest
        - accountConfigSchema
        - accountConfigUiSchema
        - credentialCapability
        - configSchema
        - configUiSchema
        - defaultConfig
        - jobDefinitions
      properties:
        providerType:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        definitionDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        accountConfigSchema:
          $ref: '#/components/schemas/JsonObject'
        accountConfigUiSchema:
          type: array
          items:
            $ref: '#/components/schemas/UiField'
        credentialCapability:
          $ref: '#/components/schemas/CredentialCapability'
        configSchema:
          $ref: '#/components/schemas/JsonObject'
        configUiSchema:
          type: array
          items:
            $ref: '#/components/schemas/UiField'
        defaultConfig:
          $ref: '#/components/schemas/JsonObject'
        jobDefinitions:
