openapi: 3.1.0
info:
  title: Lynxus Control Plane API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/api
paths:
  /auth/login:
    get:
      summary: Start OIDC login flow
      responses:
        '302':
          description: Redirect to the configured OIDC authorization endpoint
  /auth/logout:
    post:
      summary: Logout current platform session
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogoutResponse'
  /auth/session:
    get:
      summary: Get current platform user session
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserSession'
        '401':
          description: Authentication required
  /catalog/summary:
    get:
      summary: Get aggregate catalog summary
      responses:
        '200':
          description: Aggregate catalog state with assistants, agents, resources, and knowledge bases
  /catalog/references/{objectType}/{objectId}:
    get:
      summary: Get unified object reference analysis
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            $ref: '#/components/schemas/ReferenceObjectType'
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unified reference analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectReferenceAnalysis'
  /catalog/deletion-preview/{objectType}/{objectId}:
    get:
      summary: Get deletion impact preview for a catalog object
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            $ref: '#/components/schemas/ReferenceObjectType'
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion impact preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionImpactPreview'
  /assistants:
    get:
      summary: List assistants
    post:
      summary: Create assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantRequest'
  /assistants/{assistantId}:
    put:
      summary: Update assistant and optionally publish a new release
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssistantRequest'
  /agents:
    get:
      summary: List agents
    post:
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
  /agents/{agentId}:
    get:
      summary: Get agent detail
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
    put:
      summary: Update agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
  /playbooks:
    get:
      summary: List playbooks
    post:
      summary: Create playbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybookRequest'
  /playbooks/{playbookId}:
    get:
      summary: Get playbook detail
      parameters:
        - in: path
          name: playbookId
          required: true
          schema:
            type: string
    put:
      summary: Update playbook
      parameters:
        - in: path
          name: playbookId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaybookRequest'
  /resources:
    get:
      summary: List resources
    post:
      summary: Create resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
  /resources/{resourceId}:
    put:
      summary: Update resource
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
  /resources/{resourceId}/versions:
    get:
      summary: List resource versions
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
    post:
      summary: Create resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceVersionRequest'
  /resources/{resourceId}/versions/{versionId}:
    put:
      summary: Update resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceVersionRequest'
    delete:
      summary: Delete resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /resources/{resourceId}/versions/{versionId}/publish:
    patch:
      summary: Publish a resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /knowledge-bases:
    get:
      summary: List knowledge bases
      responses:
        '200':
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
    post:
      summary: Create knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '200':
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
  /knowledge-bases/{knowledgeBaseId}:
    get:
      summary: Get knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge base detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
    put:
      summary: Update knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
    delete:
      summary: Delete knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/releases:
    get:
      summary: List knowledge releases
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge release list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeRelease'
    post:
      summary: Create knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeReleaseRequest'
      responses:
        '200':
          description: Knowledge release created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRelease'
  /knowledge-bases/{knowledgeBaseId}/releases/{releaseId}/publish:
    patch:
      summary: Publish knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: releaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/releases/{releaseId}:
    delete:
      summary: Delete knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: releaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/references:
    get:
      summary: List knowledge references
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeReference'
  /knowledge-bases/{knowledgeBaseId}/upload-sessions:
    post:
      summary: Create a knowledge upload session
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadSession'
  /knowledge-bases/{knowledgeBaseId}/upload-sessions/{uploadSessionId}/complete:
    post:
      summary: Complete a knowledge file upload and trigger import
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: uploadSessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadCompletion'
  /knowledge-bases/{knowledgeBaseId}/url-imports:
    post:
      summary: Import a knowledge document from URL
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeUrlImportRequest'
      responses:
        '200':
          description: URL import queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadCompletion'
  /knowledge-bases/{knowledgeBaseId}/files:
    get:
      summary: List uploaded knowledge files
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge file list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeFile'
  /knowledge-bases/{knowledgeBaseId}/import-jobs:
    get:
      summary: List knowledge import jobs
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge import jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeImportJob'
  /knowledge-bases/{knowledgeBaseId}/import-jobs/{jobId}/retry:
    post:
      summary: Retry a failed knowledge import job
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadCompletion'
  /knowledge-bases/{knowledgeBaseId}/documents:
    get:
      summary: List parsed knowledge documents
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeDocument'
  /knowledge-bases/{knowledgeBaseId}/snapshots:
    get:
      summary: List knowledge index snapshots
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeIndexSnapshot'
    post:
      summary: Create a knowledge index snapshot and trigger build
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeIndexSnapshotRequest'
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIndexSnapshot'
  /knowledge-bases/{knowledgeBaseId}/snapshots/{snapshotId}/retry:
    post:
      summary: Retry a failed knowledge snapshot build
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: snapshotId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIndexSnapshot'
  /knowledge-bases/{knowledgeBaseId}/retrieval-preview:
    post:
      summary: Preview retrieval hits against a ready knowledge snapshot
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeRetrievalPreviewRequest'
      responses:
        '200':
          description: Retrieval preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRetrievalPreviewResult'
  /session-runtime/sessions:
    get:
      summary: List session runtime sessions
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionRuntimeSession'
    post:
      summary: Create a session runtime session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}:
    get:
      summary: Get session runtime detail
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeDetail'
  /session-runtime/sessions/{sessionId}/messages:
    post:
      summary: Send a user message into an existing session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSessionMessageRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
        '409':
          description: Session is busy or rejected the message
  /session-runtime/sessions/{sessionId}/human-resume:
    post:
      summary: Resume a waiting playbook run with human input
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanResumeRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}/external-callback:
    post:
      summary: Resume a waiting playbook run with external callback payload
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCallbackRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}/handoff/end:
    post:
      summary: End session human handoff mode
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
  /session-runtime/sessions/{sessionId}/human-reply:
    post:
      summary: Append a human operator reply during session handoff
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanOperatorReplyRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeSession'
components:
  schemas:
    PlatformRole:
      type: string
      enum: [PLATFORM_ADMIN, DOMAIN_ADMIN, DEVELOPER, BUSINESS_USER]
    UserSession:
      type: object
      required: [userId, displayName, currentRole, availableRoles]
      properties:
        userId:
          type: string
        displayName:
          type: string
        currentRole:
          $ref: '#/components/schemas/PlatformRole'
        availableRoles:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRole'
    ApiResponseUserSession:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UserSession'
        timestamp:
          type: string
          format: date-time
    LogoutResponse:
      type: object
      required: [postLogoutRedirectUrl]
      properties:
        postLogoutRedirectUrl:
          type: string
    ApiResponseLogoutResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LogoutResponse'
        timestamp:
          type: string
          format: date-time
    VersionStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    AssistantModelPolicy:
      type: object
      properties:
        defaultModelResourceId:
          type: string
          nullable: true
    KnowledgeAccessPolicy:
      type: object
      properties:
        enabled:
          type: boolean
        knowledgeBaseId:
          type: string
          nullable: true
    MemoryPolicy:
      type: object
      properties:
        enabled:
          type: boolean
        windowSize:
          type: integer
    AgentExecutionPolicy:
      type: object
      properties:
        inheritAssistantDefaults:
          type: boolean
        modelResourceId:
          type: string
          nullable: true
        systemPrompt:
          type: string
        knowledgeEnabled:
          type: boolean
        inheritAssistantKnowledge:
          type: boolean
        knowledgeBaseId:
          type: string
          nullable: true
        memoryWindowSize:
          type: integer
        skillResourceIds:
          type: array
          items:
            type: string
        toolResourceIds:
          type: array
          items:
            type: string
    PlaybookExecutionPolicy:
      type: object
      properties:
        timeoutPolicy:
          type: string
          nullable: true
        retryPolicy:
          type: string
          nullable: true
    PlaybookNodeType:
      type: string
      enum: [STEP, TOOL_TASK, HUMAN_TASK, EXTERNAL_INTERACTION, END]
    PlaybookNode:
      type: object
      properties:
        nodeKey:
          type: string
        nodeName:
          type: string
        nodeType:
          $ref: '#/components/schemas/PlaybookNodeType'
        description:
          type: string
          nullable: true
        scriptRef:
          type: string
          nullable: true
        scriptVersion:
          type: string
          nullable: true
        toolId:
          type: string
          nullable: true
        toolOperation:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
    PlaybookEdge:
      type: object
      properties:
        edgeKey:
          type: string
        sourceNodeKey:
          type: string
        targetNodeKey:
          type: string
        routeKey:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        defaultEdge:
          type: boolean
    Playbook:
      type: object
      properties:
        id:
          type: string
        assistantId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        inputSchema:
          type: string
          nullable: true
        resultSchema:
          type: string
          nullable: true
        executionPolicy:
          $ref: '#/components/schemas/PlaybookExecutionPolicy'
        allowHumanTask:
          type: boolean
        allowExternalInteraction:
          type: boolean
        entryNodeKey:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PlaybookNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/PlaybookEdge'
    ResourceType:
      type: string
      enum: [TOOL, LLM_MODEL, SKILL]
    ShareScope:
      type: string
      enum: [PRIVATE, DOMAIN_SHARED]
    ToolProviderType:
      type: string
      enum: [HTTP, MCP]
    ToolKind:
      type: string
      enum: [RESOURCE, BUILTIN]
    ToolOperation:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: string
        outputSchema:
          type: string
    HttpToolProviderConfig:
      type: object
      properties:
        endpoint:
          type: string
        method:
          type: string
    McpToolProviderConfig:
      type: object
      properties:
        serverName:
          type: string
        transport:
          type: string
        connectionUri:
          type: string
        namespace:
          type: string
        heartbeatSeconds:
          type: integer
        operationMappings:
          type: object
          additionalProperties:
            type: string
    ToolConfig:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/ToolOperation'
        providerType:
          $ref: '#/components/schemas/ToolProviderType'
        authType:
          type: string
        timeoutSeconds:
          type: integer
        retryPolicy:
          type: string
        http:
          allOf:
            - $ref: '#/components/schemas/HttpToolProviderConfig'
          nullable: true
        mcp:
          allOf:
            - $ref: '#/components/schemas/McpToolProviderConfig'
          nullable: true
    LlmModelConfig:
      type: object
      properties:
        providerType:
          type: string
        modelId:
          type: string
        baseUrl:
          type: string
        apiKeyEnvVar:
          type: string
        temperature:
          type: number
        maxTokens:
          type: integer
    SkillConfig:
      type: object
      properties:
        skillName:
          type: string
        skillDesc:
          type: string
        skillPrompt:
          type: string
    ResourceVersionConfiguration:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ResourceType'
        tool:
          allOf:
            - $ref: '#/components/schemas/ToolConfig'
          nullable: true
        llmModel:
          allOf:
            - $ref: '#/components/schemas/LlmModelConfig'
          nullable: true
        skill:
          allOf:
            - $ref: '#/components/schemas/SkillConfig'
          nullable: true
    ResourceVersion:
      type: object
      properties:
        id:
          type: string
        resourceId:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedAt:
