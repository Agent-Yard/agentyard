      summary: List platform audit events
      parameters:
      - in: query
        name: aggregateType
        required: false
        schema:
          $ref: '#/components/schemas/PlatformAggregateType'
      - in: query
        name: aggregateId
        required: false
        schema:
          type: string
      - in: query
        name: since
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        required: false
        schema:
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Platform audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformEventPage'
  /resources:
    get:
      summary: List resources
    post:
      summary: Create resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
  /resources/{resourceId}:
    put:
      summary: Update resource
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
  /resources/{resourceId}/versions:
    get:
      summary: List resource versions
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
    post:
      summary: Create resource version
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceVersionRequest'
  /resources/{resourceId}/versions/{versionId}:
    put:
      summary: Update resource version
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      - in: path
        name: versionId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceVersionRequest'
    delete:
      summary: Delete resource version
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      - in: path
        name: versionId
        required: true
        schema:
          type: string
  /resources/{resourceId}/versions/{versionId}/publish:
    patch:
      summary: Publish a resource version
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      - in: path
        name: versionId
        required: true
        schema:
          type: string
  /knowledge-bases:
    get:
      summary: List knowledge bases
      responses:
        '200':
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
    post:
      summary: Create knowledge base
      requestBody:
        required: true
