openapi: 3.1.0
info:
  title: Lynxus Control Plane API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /auth/session:
    get:
      summary: Get current development session
      responses:
        '200':
          description: Current session
  /catalog/summary:
    get:
      summary: Get aggregate catalog summary
      responses:
        '200':
          description: Aggregate catalog state with assistants, agents, resources, and orchestrations
  /catalog/references/{objectType}/{objectId}:
    get:
      summary: Get unified object reference analysis
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            $ref: '#/components/schemas/ReferenceObjectType'
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unified reference analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectReferenceAnalysis'
  /catalog/deletion-preview/{objectType}/{objectId}:
    get:
      summary: Get deletion impact preview for a catalog object
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            $ref: '#/components/schemas/ReferenceObjectType'
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion impact preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionImpactPreview'
  /assistants:
    get:
      summary: List assistants
    post:
      summary: Create assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantRequest'
  /assistants/{assistantId}:
    put:
      summary: Update assistant and optionally publish a new release
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssistantRequest'
  /agents:
    get:
      summary: List agents
    post:
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
  /agents/{agentId}:
    get:
      summary: Get agent detail
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
    put:
      summary: Update agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
  /resources:
    get:
      summary: List resources
    post:
      summary: Create resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
  /resources/{resourceId}:
    put:
      summary: Update resource
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
  /resources/{resourceId}/versions:
    get:
      summary: List resource versions
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
    post:
      summary: Create resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceVersionRequest'
  /resources/{resourceId}/versions/{versionId}:
    put:
      summary: Update resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceVersionRequest'
    delete:
      summary: Delete resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /resources/{resourceId}/versions/{versionId}/publish:
    patch:
      summary: Publish a resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /knowledge-bases:
    get:
      summary: List knowledge bases
      responses:
        '200':
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
    post:
      summary: Create knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '200':
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
  /knowledge-bases/{knowledgeBaseId}:
    get:
      summary: Get knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge base detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
    put:
      summary: Update knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
    delete:
      summary: Delete knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/releases:
    get:
      summary: List knowledge releases
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge release list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeRelease'
    post:
      summary: Create knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeReleaseRequest'
      responses:
        '200':
          description: Knowledge release created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRelease'
  /knowledge-bases/{knowledgeBaseId}/releases/{releaseId}/publish:
    patch:
      summary: Publish knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: releaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/releases/{releaseId}:
    delete:
      summary: Delete knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: releaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/references:
    get:
      summary: List knowledge references
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeReference'
  /knowledge-bases/{knowledgeBaseId}/upload-sessions:
    post:
      summary: Create a knowledge upload session
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadSession'
  /knowledge-bases/{knowledgeBaseId}/upload-sessions/{uploadSessionId}/complete:
    post:
      summary: Complete a knowledge file upload and trigger import
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: uploadSessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadCompletion'
  /knowledge-bases/{knowledgeBaseId}/url-imports:
    post:
      summary: Import a knowledge document from URL
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeUrlImportRequest'
      responses:
        '200':
          description: URL import queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadCompletion'
  /knowledge-bases/{knowledgeBaseId}/files:
    get:
      summary: List uploaded knowledge files
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge file list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeFile'
  /knowledge-bases/{knowledgeBaseId}/import-jobs:
    get:
      summary: List knowledge import jobs
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge import jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeImportJob'
  /knowledge-bases/{knowledgeBaseId}/documents:
    get:
      summary: List parsed knowledge documents
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeDocument'
  /knowledge-bases/{knowledgeBaseId}/snapshots:
    get:
      summary: List knowledge index snapshots
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeIndexSnapshot'
    post:
      summary: Create a knowledge index snapshot and trigger build
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeIndexSnapshotRequest'
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIndexSnapshot'
  /orchestrations:
    get:
      summary: List assistant orchestration graphs
  /orchestrations/{assistantId}:
    get:
      summary: Get assistant orchestration graph
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
    put:
      summary: Save assistant orchestration graph
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrchestrationRequest'
  /tasks:
    get:
      summary: List task instances
    post:
      summary: Launch task with explicit assistant binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLaunchRequest'
      responses:
        '200':
          description: Task instance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
  /runtime/sessions:
    get:
      summary: List conversation runtime sessions
    post:
      summary: Create a runtime session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationSessionRequest'
  /runtime/sessions/{sessionId}:
    get:
      summary: Get runtime session detail
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSession'
  /runtime/sessions/{sessionId}/messages:
    post:
      summary: Send a message to an existing runtime session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageRequest'
      responses:
        '200':
          description: Updated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSession'
        '409':
          description: Session already has an active workflow
  /workflows:
    get:
      summary: List workflow instances
      responses:
        '200':
          description: Workflow list
  /workflows/{workflowId}:
    get:
      summary: Get workflow detail
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
  /workflows/{workflowId}/human-action:
    patch:
      summary: Submit structured human action and resume or terminate the workflow
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanActionRequest'
      responses:
        '200':
          description: Updated workflow state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
components:
  schemas:
    VersionStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    TaskStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_HUMAN, COMPLETED, FAILED, CANCELLED]
    WorkflowStatus:
      type: string
      enum: [DRAFT, RUNNING, WAITING_HUMAN, COMPLETED, FAILED, CANCELLED]
    NodeStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_HUMAN, COMPLETED, FAILED, CANCELLED]
    OrchestrationNodeType:
      type: string
      enum: [START, AGENT, HUMAN, END]
    AssistantModelPolicy:
      type: object
      properties:
        providerResourceId:
          type: string
          nullable: true
        temperature:
          type: number
        maxTokens:
          type: integer
    RagPolicy:
      type: object
      properties:
        enabled:
          type: boolean
        knowledgeBaseId:
          type: string
          nullable: true
    MemoryPolicy:
      type: object
      properties:
        enabled:
          type: boolean
        windowSize:
          type: integer
    AgentExecutionPolicy:
      type: object
      properties:
        inheritAssistantDefaults:
          type: boolean
        modelResourceId:
          type: string
          nullable: true
        systemPrompt:
          type: string
        ragEnabled:
          type: boolean
        inheritAssistantKnowledge:
          type: boolean
        knowledgeBaseId:
          type: string
          nullable: true
        memoryWindowSize:
          type: integer
        skillResourceIds:
          type: array
          items:
            type: string
        toolResourceIds:
          type: array
          items:
            type: string
    ResourceType:
      type: string
      enum: [TOOL, LLM_MODEL, SKILL]
    ShareScope:
      type: string
      enum: [PRIVATE, DOMAIN_SHARED]
    ToolProviderType:
      type: string
      enum: [HTTP, MCP]
    ToolOperation:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: string
        outputSchema:
          type: string
    HttpToolProviderConfig:
      type: object
      properties:
        endpoint:
          type: string
        method:
          type: string
    McpToolProviderConfig:
      type: object
      properties:
        serverName:
          type: string
        transport:
          type: string
        connectionUri:
          type: string
        namespace:
          type: string
        heartbeatSeconds:
          type: integer
        operationMappings:
          type: object
          additionalProperties:
            type: string
    ToolConfig:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/ToolOperation'
        providerType:
          $ref: '#/components/schemas/ToolProviderType'
        authType:
          type: string
        timeoutSeconds:
          type: integer
        retryPolicy:
          type: string
        http:
          allOf:
            - $ref: '#/components/schemas/HttpToolProviderConfig'
          nullable: true
        mcp:
          allOf:
            - $ref: '#/components/schemas/McpToolProviderConfig'
          nullable: true
    LlmModelConfig:
      type: object
      properties:
        providerType:
          type: string
        modelId:
          type: string
        baseUrl:
          type: string
        apiKeyEnvVar:
          type: string
        organization:
          type: string
        project:
          type: string
        region:
          type: string
        temperature:
          type: number
        maxTokens:
          type: integer
    SkillConfig:
      type: object
      properties:
        skillName:
          type: string
        skillDesc:
          type: string
        skillPrompt:
          type: string
    ResourceVersionConfiguration:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ResourceType'
        tool:
          allOf:
            - $ref: '#/components/schemas/ToolConfig'
          nullable: true
        llmModel:
          allOf:
            - $ref: '#/components/schemas/LlmModelConfig'
          nullable: true
        skill:
          allOf:
            - $ref: '#/components/schemas/SkillConfig'
          nullable: true
    ResourceVersion:
      type: object
      properties:
        id:
          type: string
        resourceId:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        configuration:
          $ref: '#/components/schemas/ResourceVersionConfiguration'
    Resource:
      type: object
      properties:
        id:
          type: string
        domainId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/ResourceType'
        shareScope:
          $ref: '#/components/schemas/ShareScope'
        ownerType:
          type: string
        ownerId:
          type: string
        summary:
          type: string
        steward:
          type: string
        tags:
          type: array
          items:
            type: string
        latestVersion:
          allOf:
            - $ref: '#/components/schemas/ResourceVersion'
          nullable: true
        effectiveVersion:
          allOf:
            - $ref: '#/components/schemas/ResourceVersion'
          nullable: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceVersion'
    CreateResourceRequest:
      type: object
      properties:
        domainId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/ResourceType'
        shareScope:
          $ref: '#/components/schemas/ShareScope'
        ownerType:
          type: string
        ownerId:
          type: string
        summary:
          type: string
        steward:
          type: string
        tags:
          type: array
          items:
            type: string
        initialVersion:
          $ref: '#/components/schemas/CreateResourceVersionRequest'
    UpdateResourceRequest:
      type: object
      properties:
        name:
          type: string
        shareScope:
          $ref: '#/components/schemas/ShareScope'
        ownerType:
          type: string
        ownerId:
          type: string
        summary:
          type: string
        steward:
          type: string
        tags:
          type: array
          items:
            type: string
    CreateResourceVersionRequest:
      type: object
      properties:
        summary:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        configuration:
          $ref: '#/components/schemas/ResourceVersionConfiguration'
    UpdateResourceVersionRequest:
      type: object
      properties:
        summary:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        configuration:
          $ref: '#/components/schemas/ResourceVersionConfiguration'
    KnowledgeRetrievalProfile:
      type: object
      properties:
        defaultTopK:
          type: integer
        retrievalMode:
          type: string
          enum: [LEXICAL, VECTOR, HYBRID]
        minScore:
          type: number
    KnowledgeBindingSnapshot:
      type: object
      properties:
        knowledgeBaseId:
          type: string
        knowledgeBaseName:
          type: string
        knowledgeReleaseId:
          type: string
        knowledgeReleaseVersion:
          type: string
        snapshotId:
          type: string
        defaultTopK:
          type: integer
        retrievalMode:
          type: string
          enum: [LEXICAL, VECTOR, HYBRID]
        minScore:
          type: number
    KnowledgeRelease:
      type: object
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        summary:
          type: string
        snapshotId:
          type: string
        retrievalProfile:
          $ref: '#/components/schemas/KnowledgeRetrievalProfile'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
        domainId:
          type: string
        name:
          type: string
        shareScope:
          $ref: '#/components/schemas/ShareScope'
        ownerType:
          type: string
        ownerId:
          type: string
        summary:
          type: string
        steward:
          type: string
        tags:
          type: array
          items:
            type: string
        latestRelease:
          allOf:
            - $ref: '#/components/schemas/KnowledgeRelease'
          nullable: true
        effectiveRelease:
          allOf:
            - $ref: '#/components/schemas/KnowledgeRelease'
          nullable: true
        releases:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRelease'
    KnowledgeReference:
      type: object
      properties:
        knowledgeBaseId:
          type: string
        referenceKind:
          type: string
        sourceType:
          type: string
        sourceId:
          type: string
        sourceName:
          type: string
        knowledgeReleaseId:
          type: string
          nullable: true
        knowledgeReleaseVersion:
          type: string
          nullable: true
        blocksDeletion:
          type: boolean
    ReferenceObjectType:
      type: string
      enum:
        - DOMAIN
        - SCENARIO
        - ASSISTANT
        - AGENT
        - RESOURCE
        - KNOWLEDGE_BASE
    ReferenceRelationMode:
      type: string
      enum:
        - DIRECT
        - INDIRECT
    ReferenceImpactLevel:
      type: string
      enum:
        - BLOCKS_DELETION
        - ADVISORY
    ObjectReferenceRelation:
      type: object
      properties:
        relationKind:
          type: string
        relationRole:
          type: string
        relationMode:
          $ref: '#/components/schemas/ReferenceRelationMode'
        impactLevel:
          $ref: '#/components/schemas/ReferenceImpactLevel'
        targetType:
          type: string
        targetId:
          type: string
        targetName:
          type: string
        releaseId:
          type: string
          nullable: true
        releaseVersion:
          type: string
          nullable: true
        resourceVersionId:
          type: string
          nullable: true
        resourceVersion:
          type: string
