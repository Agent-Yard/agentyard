  /internal/tool-runs/{id}/runtime:
    get:
      operationId: getToolRunRuntime
      tags:
      - Agent internal
      security:
      - bearerInternal: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRunRuntime'
        '401':
          description: Trusted service bearer token required
        '403':
          description: Execution closed, capability revoked, or access denied. Do not retry as a pause.
        '423':
          description: 'EXECUTION_PAUSED: execution is paused before authorization for the next side effect. Wait for explicit
            resume and obtain runtime authorization again; do not repeat unknown side effects.'
