openapi: 3.1.0
info:
  title: Lynxus Control Plane API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/api
paths:
  /auth/login:
    get:
      summary: Start OIDC login flow
      responses:
        '302':
          description: Redirect to the configured OIDC authorization endpoint
  /auth/logout:
    post:
      summary: Logout current platform session
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogoutResponse'
  /auth/session:
    get:
      summary: Get current platform user session
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserSession'
        '401':
          description: Authentication required
  /catalog/summary:
    get:
      summary: Get aggregate catalog summary
      responses:
        '200':
          description: Aggregate catalog state with assistants, agents, resources, and knowledge bases
  /extensions/channel-providers:
    get:
      summary: List registered channel provider definitions
      responses:
        '200':
          description: Registered channel provider definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderDefinitionList'
        '503':
          description: Extension definition registry is not ready
  /extensions/tool-connectors:
    get:
      summary: List registered tool connector definitions
      responses:
        '200':
          description: Registered tool connector definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseToolConnectorDefinitionList'
        '503':
          description: Extension definition registry is not ready
  /channel-admin/profiles:
    get:
      summary: List channel profiles
      responses:
        '200':
          description: Channel profiles with credential material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfileList'
    post:
      summary: Create channel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelProfilePayload'
      responses:
        '200':
          description: Created channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '400':
          description: Channel profile payload is invalid
        '422':
          description: Integration account, assistant, scenario, or provider config is invalid
        '503':
          description: Channel provider registry is not ready
  /channel-admin/profiles/{channelProfileId}:
    get:
      summary: Get channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel profile with credential material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '404':
          description: Channel profile not found
    put:
      summary: Update channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelProfilePayload'
      responses:
        '200':
          description: Updated channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '400':
          description: Channel profile payload is invalid
        '409':
          description: Channel profile revision conflict
        '422':
          description: Integration account, assistant, scenario, or provider config is invalid
        '503':
          description: Channel provider registry is not ready
    delete:
      summary: Disable channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: query
          name: expectedRevision
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Disabled channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProfile'
        '400':
          description: expectedRevision is missing or invalid
        '409':
          description: Channel profile revision conflict
  /channel-admin/profiles/{channelProfileId}/bindings:
    get:
      summary: List channel conversation bindings
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel conversation bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelConversationBindingList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/inbound-events:
    get:
      summary: List channel inbound events
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel inbound events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelInboundEventList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/outbound-deliveries:
    get:
      summary: List channel outbound deliveries
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel outbound deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelOutboundDeliveryList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/template-bindings:
    get:
      summary: List external template bindings for a channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: External template bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelTemplateBindingList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/template-bindings/{assistantId}/{messageType}/{messageSubtype}/{messageVersion}:
    put:
      summary: Create or update an external template binding
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
        - in: path
          name: messageType
          required: true
          schema:
            type: string
        - in: path
          name: messageSubtype
          required: true
          schema:
            type: string
        - in: path
          name: messageVersion
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTemplateBindingWritePayload'
      responses:
        '200':
          description: Saved external template binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelTemplateBinding'
        '409':
          description: Template binding expectedRevision is stale
        '422':
          description: Template binding tuple or variable schema is invalid
    delete:
      summary: Disable an external template binding
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
        - in: path
          name: messageType
          required: true
          schema:
            type: string
        - in: path
          name: messageSubtype
          required: true
          schema:
            type: string
        - in: path
          name: messageVersion
          required: true
          schema:
            type: string
        - in: query
          name: expectedRevision
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Disabled external template binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelTemplateBinding'
        '404':
          description: Channel profile or template binding not found
        '409':
          description: Template binding expectedRevision is stale
  /channel-admin/profiles/{channelProfileId}/jobs:
    get:
      summary: List provider jobs for a channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider job configs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobConfigList'
        '404':
          description: Channel profile not found
  /channel-admin/profiles/{channelProfileId}/jobs/{jobType}:
    put:
      summary: Create or update a provider job config
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: path
          name: jobType
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelProviderJobConfigWritePayload'
      responses:
        '200':
          description: Saved provider job config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobConfig'
        '409':
          description: Provider job is running or expectedRevision is stale
        '422':
          description: Provider job definition, schedule config, or job config is invalid
    delete:
      summary: Disable a provider job config
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: path
          name: jobType
          required: true
          schema:
            type: string
        - in: query
          name: expectedRevision
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Disabled provider job config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobConfig'
        '404':
          description: Channel profile or provider job not found
        '409':
          description: Provider job is running or expectedRevision is stale
        '422':
          description: Provider job definition is invalid
  /channel-admin/profiles/{channelProfileId}/jobs/{jobType}/runs:
    get:
      summary: List provider job run history
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: path
          name: jobType
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider job run history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobRunList'
        '404':
          description: Channel profile or provider job not found
        '422':
          description: Provider job definition is invalid
    post:
      summary: Manually run a provider job through channel-gateway
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: path
          name: jobType
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider job run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelProviderJobRun'
        '404':
          description: Channel profile or provider job not found
        '409':
          description: Provider job is already running or not active
        '422':
          description: Provider job definition is invalid
  /integration/accounts:
    get:
      summary: List integration accounts
      responses:
        '200':
          description: Integration accounts with credential state redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccountList'
    post:
      summary: Create integration account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationAccountPayload'
      responses:
        '200':
          description: Created integration account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '422':
          description: Integration account subject or config is invalid
        '503':
          description: Extension definition registry is not ready
  /integration/accounts/{accountId}:
    get:
      summary: Get integration account
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Integration account with credential state redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
    put:
      summary: Update integration account
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationAccountPayload'
      responses:
        '200':
          description: Updated integration account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '422':
          description: Integration account config is invalid
        '503':
          description: Extension definition registry is not ready
  /integration/accounts/{accountId}/status:
    put:
      summary: Update integration account status
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationAccountStatusPayload'
      responses:
        '200':
          description: Updated integration account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
  /integration/accounts/{accountId}/archive:
    post:
      summary: Archive integration account
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived integration account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
  /integration/accounts/{accountId}/credentials:
    post:
      summary: Create integration account credential
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationAccountCredentialPayload'
      responses:
        '200':
          description: Credential state after create, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported, invalid, or not allowed in current state
  /integration/accounts/{accountId}/credentials/rotate:
    post:
      summary: Rotate integration account credential
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateIntegrationAccountCredentialPayload'
      responses:
        '200':
          description: Credential state after rotate, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported, invalid, or not allowed in current state
  /integration/accounts/{accountId}/credentials/validate:
    post:
      summary: Validate integration account credential
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential state after validate, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported or not allowed in current state
  /integration/accounts/{accountId}/credentials/revoke:
    post:
      summary: Revoke integration account credential
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential state after revoke, with secret material redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIntegrationAccount'
        '409':
          description: Credential lifecycle operation is already running for this account
        '422':
          description: Credential lifecycle action is unsupported or not allowed in current state
  /internal/integration/accounts/{accountId}/credential:
    get:
      summary: Internal runtime credential lookup
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime credential for connector execution
  /catalog/references/{objectType}/{objectId}:
    get:
      summary: Get unified object reference analysis
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            $ref: '#/components/schemas/ReferenceObjectType'
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unified reference analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectReferenceAnalysis'
  /catalog/deletion-preview/{objectType}/{objectId}:
    get:
      summary: Get deletion impact preview for a catalog object
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            $ref: '#/components/schemas/ReferenceObjectType'
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion impact preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionImpactPreview'
  /events:
    get:
      summary: List platform audit events
      parameters:
        - in: query
          name: aggregateType
          required: false
          schema:
            $ref: '#/components/schemas/PlatformAggregateType'
        - in: query
          name: aggregateId
          required: false
          schema:
            type: string
        - in: query
          name: since
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Platform audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformEventPage'
  /assistants:
    get:
      summary: List assistants
    post:
      summary: Create assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantRequest'
  /assistants/{assistantId}:
    put:
      summary: Update assistant and optionally publish a new release
      parameters:
        - in: path
          name: assistantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssistantRequest'
  /agents:
    get:
      summary: List agents
    post:
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
  /agents/{agentId}:
    get:
      summary: Get agent detail
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
    put:
      summary: Update agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
  /playbooks:
    get:
      summary: List playbooks
    post:
      summary: Create playbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybookRequest'
  /playbooks/{playbookId}:
    get:
      summary: Get playbook detail
      parameters:
        - in: path
          name: playbookId
          required: true
          schema:
            type: string
    put:
      summary: Update playbook
      parameters:
        - in: path
          name: playbookId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaybookRequest'
  /resources:
    get:
      summary: List resources
    post:
      summary: Create resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
  /resources/{resourceId}:
    put:
      summary: Update resource
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
  /resources/{resourceId}/versions:
    get:
      summary: List resource versions
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
    post:
      summary: Create resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceVersionRequest'
  /resources/{resourceId}/versions/{versionId}:
    put:
      summary: Update resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceVersionRequest'
    delete:
      summary: Delete resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /resources/{resourceId}/versions/{versionId}/publish:
    patch:
      summary: Publish a resource version
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
  /knowledge-bases:
    get:
      summary: List knowledge bases
      responses:
        '200':
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
    post:
      summary: Create knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '200':
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
  /knowledge-bases/{knowledgeBaseId}:
    get:
      summary: Get knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge base detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
    put:
      summary: Update knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
    delete:
      summary: Delete knowledge base
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/releases:
    get:
      summary: List knowledge releases
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge release list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeRelease'
    post:
      summary: Create knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeReleaseRequest'
      responses:
        '200':
          description: Knowledge release created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRelease'
  /knowledge-bases/{knowledgeBaseId}/releases/{releaseId}/publish:
    patch:
      summary: Publish knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
          schema:
            type: string
        - in: path
          name: releaseId
          required: true
          schema:
            type: string
  /knowledge-bases/{knowledgeBaseId}/releases/{releaseId}:
    delete:
      summary: Delete knowledge release
      parameters:
        - in: path
          name: knowledgeBaseId
          required: true
