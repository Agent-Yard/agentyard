openapi: 3.1.0
info:
  title: Lynxus Channel Gateway Internal API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8082
paths:
  /internal/channel-events/normalized:
    post:
      summary: Ingest a normalized channel inbound event
      parameters:
        - $ref: '#/components/parameters/ExtensionRegistrationIdHeader'
        - $ref: '#/components/parameters/ExtensionDescriptorTypeHeader'
        - $ref: '#/components/parameters/ExtensionDescriptorIdHeader'
        - $ref: '#/components/parameters/LynxusTraceIdHeader'
        - $ref: '#/components/parameters/LynxusRequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizedChannelInboundEvent'
      responses:
        '200':
          description: Stored inbound event, or existing event for duplicate dedupKey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNormalizedChannelInboundEventResult'
        '400':
          description: Normalized event payload or descriptor headers are invalid
        '401':
          description: Internal auth is missing or invalid
        '404':
          description: Channel profile not found
  /internal/channel-admin/profiles:
    get:
      summary: List channel profiles
      responses:
        '200':
          description: Channel profiles with internal credential references redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelGatewayProfileList'
    post:
      summary: Create channel profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelProfileInternalPayload'
      responses:
        '200':
          description: Created channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelGatewayProfile'
        '400':
          description: Channel profile payload is invalid
        '503':
          description: Channel provider registry is not ready
  /internal/channel-admin/profiles/{channelProfileId}:
    get:
      summary: Get channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel profile with internal credential references redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelGatewayProfile'
        '404':
          description: Channel profile not found
    put:
      summary: Update channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelProfileInternalPayload'
      responses:
        '200':
          description: Updated channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelGatewayProfile'
        '400':
          description: Channel profile payload is invalid
        '409':
          description: Channel profile revision conflict
        '503':
          description: Channel provider registry is not ready
    delete:
      summary: Disable channel profile
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
        - in: query
          name: expectedRevision
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Disabled channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelGatewayProfile'
        '400':
          description: expectedRevision is missing or invalid
        '409':
          description: Channel profile revision conflict
  /internal/channel-admin/profiles/{channelProfileId}/bindings:
    get:
      summary: List channel conversation bindings
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel conversation bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelConversationBindingList'
        '404':
          description: Channel profile not found
  /internal/channel-admin/profiles/{channelProfileId}/inbound-events:
    get:
      summary: List channel inbound events
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel inbound events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelInboundEventList'
        '404':
          description: Channel profile not found
  /internal/channel-admin/profiles/{channelProfileId}/outbound-deliveries:
    get:
      summary: List channel outbound deliveries
      parameters:
        - in: path
          name: channelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel outbound deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelOutboundDeliveryList'
        '404':
          description: Channel profile not found
components:
  parameters:
    ExtensionRegistrationIdHeader:
      in: header
      name: X-Lynxus-Extension-Registration-Id
      required: true
      schema:
        type: string
    ExtensionDescriptorTypeHeader:
      in: header
      name: X-Lynxus-Extension-Descriptor-Type
      required: true
      schema:
        type: string
        enum: [CHANNEL_PROVIDER]
    ExtensionDescriptorIdHeader:
      in: header
      name: X-Lynxus-Extension-Descriptor-Id
      required: true
      schema:
        type: string
    LynxusTraceIdHeader:
      in: header
      name: X-Lynxus-Trace-Id
      required: true
      schema:
        type: string
    LynxusRequestIdHeader:
      in: header
      name: X-Lynxus-Request-Id
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    ChannelProfileStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ChannelConversationBindingStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ChannelInboundEventStatus:
      type: string
      enum: [RECEIVED, REJECTED]
    ChannelOutboundDeliveryStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
    NormalizedChannelEventType:
      type: string
      enum:
        - MESSAGE_RECEIVED
        - MESSAGE_UPDATED
        - MESSAGE_DELETED
        - CONVERSATION_UPDATED
        - MEMBER_JOINED
        - MEMBER_LEFT
        - REACTION_ADDED
        - FILE_RECEIVED
        - WEBHOOK_VERIFIED
        - UNKNOWN
    ChannelAssistantBinding:
      type: object
      properties:
        assistantId:
          type: string
          nullable: true
        scenarioId:
          type: string
          nullable: true
    ChannelProfileAccountSnapshot:
      type: object
      properties:
        accountId:
          type: string
          nullable: true
        externalSecretRef:
          type: string
          nullable: true
          maxLength: 512
    NormalizedChannelConversation:
      type: object
      required:
        - metadata
      properties:
        externalConversationId:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    NormalizedChannelSender:
      type: object
      required:
        - metadata
      properties:
        externalUserId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    NormalizedChannelAttachment:
      type: object
      required:
        - metadata
      properties:
        externalAttachmentId:
          type: string
          nullable: true
        externalFileId:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        metadata:
          type: object
          additionalProperties: true
    NormalizedChannelMessage:
      type: object
      required:
        - attachments
        - metadata
      properties:
        externalMessageId:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/NormalizedChannelAttachment'
        metadata:
          type: object
          additionalProperties: true
    NormalizedChannelTraceContext:
      type: object
      required:
        - traceparent
      properties:
        traceparent:
          type: string
          minLength: 1
        tracestate:
          type: string
          nullable: true
    NormalizedChannelInboundEvent:
      type: object
      required:
        - providerType
        - channelProfileId
        - eventType
        - dedupKey
        - normalizedPayload
        - traceContext
      properties:
        providerType:
          type: string
          maxLength: 128
        channelProfileId:
          type: string
        eventType:
          $ref: '#/components/schemas/NormalizedChannelEventType'
        dedupKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        externalEventId:
          type: string
          nullable: true
        externalConversationId:
          type: string
          nullable: true
        externalMessageId:
          type: string
          nullable: true
        externalUserId:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
        conversation:
          $ref: '#/components/schemas/NormalizedChannelConversation'
          nullable: true
        sender:
          $ref: '#/components/schemas/NormalizedChannelSender'
          nullable: true
        message:
          $ref: '#/components/schemas/NormalizedChannelMessage'
          nullable: true
        normalizedPayload:
          type: object
          additionalProperties: true
        rawPayload:
          type: object
          additionalProperties: true
          nullable: true
        traceContext:
          $ref: '#/components/schemas/NormalizedChannelTraceContext'
        metadata:
          type: object
          additionalProperties: true
          nullable: true
    NormalizedChannelInboundEventResult:
      type: object
      required:
        - eventId
        - duplicate
      properties:
        eventId:
          type: string
        duplicate:
          type: boolean
    ApiResponseNormalizedChannelInboundEventResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/NormalizedChannelInboundEventResult'
        timestamp:
          type: string
          format: date-time
    ChannelGatewayProfile:
      type: object
      required:
        - id
        - providerType
        - displayName
        - status
        - inboundEnabled
        - config
        - accountId
        - hasExternalSecretRef
        - revision
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        providerType:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 128
        status:
          $ref: '#/components/schemas/ChannelProfileStatus'
        inboundEnabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
        assistantBinding:
          $ref: '#/components/schemas/ChannelAssistantBinding'
          nullable: true
        accountId:
          type: string
          nullable: true
        hasExternalSecretRef:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseChannelGatewayProfile:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ChannelGatewayProfile'
        timestamp:
          type: string
          format: date-time
    ApiResponseChannelGatewayProfileList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChannelGatewayProfile'
        timestamp:
          type: string
          format: date-time
    CreateChannelProfileInternalPayload:
      type: object
      required:
        - providerType
        - displayName
      properties:
        providerType:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 128
        status:
          $ref: '#/components/schemas/ChannelProfileStatus'
          nullable: true
        inboundEnabled:
          type: boolean
          nullable: true
        config:
          type: object
          additionalProperties: true
          nullable: true
        assistantBinding:
          $ref: '#/components/schemas/ChannelAssistantBinding'
          nullable: true
        accountSnapshot:
          $ref: '#/components/schemas/ChannelProfileAccountSnapshot'
          nullable: true
    UpdateChannelProfileInternalPayload:
      type: object
      required:
        - providerType
        - displayName
        - expectedRevision
      properties:
        providerType:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 128
        status:
          $ref: '#/components/schemas/ChannelProfileStatus'
          nullable: true
        inboundEnabled:
          type: boolean
          nullable: true
        config:
          type: object
          additionalProperties: true
          nullable: true
        assistantBinding:
          $ref: '#/components/schemas/ChannelAssistantBinding'
          nullable: true
        accountSnapshot:
          $ref: '#/components/schemas/ChannelProfileAccountSnapshot'
          nullable: true
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
    ChannelConversationBinding:
      type: object
      required:
        - id
        - channelProfileId
        - externalConversationId
        - status
        - metadata
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        channelProfileId:
          type: string
        externalConversationId:
          type: string
        externalUserId:
          type: string
          nullable: true
        assistantId:
          type: string
          nullable: true
        customerId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ChannelConversationBindingStatus'
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChannelInboundEvent:
      type: object
      required:
        - eventId
        - channelProfileId
        - providerType
        - eventType
        - dedupKey
        - rawPayload
        - normalizedPayload
        - status
        - createdAt
        - updatedAt
      properties:
        eventId:
          type: string
        channelProfileId:
          type: string
        providerType:
          type: string
        eventType:
          type: string
        externalEventId:
          type: string
          nullable: true
        externalConversationId:
          type: string
          nullable: true
        externalMessageId:
          type: string
          nullable: true
        dedupKey:
          type: string
        rawPayload:
          type: object
          additionalProperties: true
        normalizedPayload:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ChannelInboundEventStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChannelOutboundDelivery:
      type: object
      required:
        - deliveryId
        - channelProfileId
        - providerType
        - payload
        - status
        - attemptCount
        - createdAt
        - updatedAt
      properties:
        deliveryId:
          type: string
        channelProfileId:
          type: string
        providerType:
          type: string
        sessionId:
          type: string
          nullable: true
        sessionMessageId:
          type: string
          nullable: true
        externalConversationId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ChannelOutboundDeliveryStatus'
        attemptCount:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseChannelConversationBindingList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChannelConversationBinding'
        timestamp:
          type: string
          format: date-time
    ApiResponseChannelInboundEventList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChannelInboundEvent'
        timestamp:
          type: string
          format: date-time
    ApiResponseChannelOutboundDeliveryList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChannelOutboundDelivery'
        timestamp:
          type: string
          format: date-time
