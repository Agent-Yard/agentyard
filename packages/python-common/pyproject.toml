[project]
name = "lynxus-python-common"
version = "0.1.0"
description = "Shared Python logging helpers for Lynxus services"
requires-python = ">=3.11"
dependencies = [
    "structlog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynxus_common"]
