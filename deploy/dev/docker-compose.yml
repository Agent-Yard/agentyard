  sandbox:
    image: ${AGENTYARD_IMAGE_SANDBOX:-ghcr.io/agent-infra/sandbox:1.0.0.152}
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined

  channel-gateway:
    build:
      context: ../..
      dockerfile: apps/channel-gateway/Dockerfile
    image: agentyard-channel-gateway:dev
    restart: unless-stopped
    env_file:
      - path: ../../.env.dev
        required: false
      - path: ../../.env.dev.local
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      AGENTYARD_CHANNEL_GATEWAY_PORT: 8082
      AGENTYARD_CHANNEL_GATEWAY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentyard_channel_gateway
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-agentyard}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-agentyard}
