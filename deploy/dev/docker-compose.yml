  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: lynxus-worker:dev
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_WORKER_INSTANCE_ID:-worker-1}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LYNXUS_WORKER_PORT: 8081
      LYNXUS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lynxus_core
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      LYNXUS_REDIS_HOST: redis
      LYNXUS_REDIS_PORT: 6379
      LYNXUS_REDIS_DATABASE: ${LYNXUS_REDIS_DATABASE:-0}
      LYNXUS_REDIS_USERNAME: ${LYNXUS_REDIS_USERNAME:-}
      LYNXUS_REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:-lynxus}
      LYNXUS_REDIS_SSL_ENABLED: ${LYNXUS_REDIS_SSL_ENABLED:-false}
      LYNXUS_API_BASE_URL: http://api-router:8080/api
      LYNXUS_AGENT_RUNTIME_BASE_URL: http://agent-runtime-router:8090
      LYNXUS_SANDBOX_BASE_URL: http://sandbox:8080
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service-router:8091
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_TEMPORAL_TARGET: temporal:7233
      LYNXUS_TEMPORAL_NAMESPACE: ${LYNXUS_TEMPORAL_NAMESPACE:-default}
      LYNXUS_TEMPORAL_TASK_QUEUE: ${LYNXUS_TEMPORAL_TASK_QUEUE:-lynxus-customer-ops}
      LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
    depends_on:
      temporal:
        condition: service_started
      api:
        condition: service_started
      knowledge-service:
        condition: service_started
      agent-runtime:
        condition: service_started
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started

  worker-2:
    profiles: ["multi-instance"]
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: lynxus-worker:dev
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_WORKER_INSTANCE_ID_SECONDARY:-worker-2}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LYNXUS_WORKER_PORT: 8081
      LYNXUS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lynxus_core
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      LYNXUS_REDIS_HOST: redis
      LYNXUS_REDIS_PORT: 6379
      LYNXUS_REDIS_DATABASE: ${LYNXUS_REDIS_DATABASE:-0}
      LYNXUS_REDIS_USERNAME: ${LYNXUS_REDIS_USERNAME:-}
      LYNXUS_REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:-lynxus}
      LYNXUS_REDIS_SSL_ENABLED: ${LYNXUS_REDIS_SSL_ENABLED:-false}
      LYNXUS_API_BASE_URL: http://api-router:8080/api
      LYNXUS_AGENT_RUNTIME_BASE_URL: http://agent-runtime-router:8090
      LYNXUS_SANDBOX_BASE_URL: http://sandbox:8080
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service-router:8091
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_TEMPORAL_TARGET: temporal:7233
      LYNXUS_TEMPORAL_NAMESPACE: ${LYNXUS_TEMPORAL_NAMESPACE:-default}
      LYNXUS_TEMPORAL_TASK_QUEUE: ${LYNXUS_TEMPORAL_TASK_QUEUE:-lynxus-customer-ops}
      LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
    depends_on:
      temporal:
        condition: service_started
      api:
        condition: service_started
      knowledge-service:
        condition: service_started
      agent-runtime:
        condition: service_started
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${LYNXUS_DEV_VITE_API_BASE_URL:-/api}
        VITE_DEPLOY_ENV: ${LYNXUS_DEV_VITE_DEPLOY_ENV:-dev}
    image: lynxus-web:dev
    restart: unless-stopped
    ports:
      - "${LYNXUS_DEV_WEB_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_DEV_WEB_PORT:-8080}:80"
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
