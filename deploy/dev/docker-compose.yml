x-python-package-index-build-args: &python-package-index-build-args
  - PIP_INDEX_URL
  - PIP_EXTRA_INDEX_URL
  - PIP_TRUSTED_HOST
  - UV_INDEX_URL
  - UV_EXTRA_INDEX_URL

services:
  postgres:
    image: ${AGENTYARD_IMAGE_POSTGRES:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentyard
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-agentyard}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-agentyard}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-bootstrap:
    image: ${AGENTYARD_IMAGE_POSTGRES_BOOTSTRAP:-postgres:17.6}
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-agentyard}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-agentyard}
      AGENTYARD_CORE_DATABASE: agentyard_core
      AGENTYARD_CHANNEL_GATEWAY_DATABASE: agentyard_channel_gateway
      AGENTYARD_KNOWLEDGE_DATABASE: agentyard_knowledge
      AGENTYARD_AGENT_RUNTIME_DATABASE: ${AGENTYARD_AGENT_RUNTIME_DATABASE:-agentyard_agent_runtime}
    depends_on:
      - postgres
    volumes:
      - ../common/postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

  minio:
    image: ${AGENTYARD_IMAGE_MINIO:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AGENTYARD_OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AGENTYARD_OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${AGENTYARD_DEV_MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${AGENTYARD_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: ${AGENTYARD_IMAGE_REDIS:-redis:7.4-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${AGENTYARD_REDIS_PASSWORD:-agentyard}
    environment:
      REDIS_PASSWORD: ${AGENTYARD_REDIS_PASSWORD:-agentyard}
    ports:
      - "${AGENTYARD_DEV_REDIS_BIND_ADDRESS:-127.0.0.1}:${AGENTYARD_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: ${AGENTYARD_IMAGE_TEMPORAL:-temporalio/auto-setup:1.28.1}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-agentyard}
      POSTGRES_PWD: ${SPRING_DATASOURCE_PASSWORD:-agentyard}
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  temporal-ui:
    image: ${AGENTYARD_IMAGE_TEMPORAL_UI:-temporalio/ui:2.39.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  temporal-ui-gateway:
    image: ${AGENTYARD_IMAGE_CADDY:-caddy:2.8.4-alpine}
    restart: unless-stopped
    environment:
      AGENTYARD_TEMPORAL_UI_USERNAME: ${AGENTYARD_TEMPORAL_UI_USERNAME:-observer}
      AGENTYARD_TEMPORAL_UI_PASSWORD: ${AGENTYARD_TEMPORAL_UI_PASSWORD:-change-me-temporal-ui}
    command:
      - /bin/sh
      - -ec
      - |
        export AGENTYARD_TEMPORAL_UI_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$AGENTYARD_TEMPORAL_UI_PASSWORD")"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${AGENTYARD_DEV_TEMPORAL_UI_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_DEV_TEMPORAL_UI_PORT:-8088}:8088"
    volumes:
      - ../common/temporal-ui-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - temporal-ui

  knowledge-service:
    build:
      context: ../..
      dockerfile: apps/knowledge-service/Dockerfile
      args: *python-package-index-build-args
    image: agentyard-knowledge-service:dev
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_KNOWLEDGE_INSTANCE_ID:-knowledge-service-1}
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN}
      AGENTYARD_LOG_FORMAT: ${AGENTYARD_LOG_FORMAT:-json}
      AGENTYARD_KNOWLEDGE_DATABASE_URL: postgresql+psycopg://${SPRING_DATASOURCE_USERNAME:-agentyard}:${SPRING_DATASOURCE_PASSWORD:-agentyard}@postgres:5432/agentyard_knowledge
      AGENTYARD_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE: ${AGENTYARD_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE:-HYBRID}
      AGENTYARD_KNOWLEDGE_EMBEDDING_BASE_URL: ${AGENTYARD_KNOWLEDGE_EMBEDDING_BASE_URL:-}
      AGENTYARD_KNOWLEDGE_EMBEDDING_MODEL: ${AGENTYARD_KNOWLEDGE_EMBEDDING_MODEL:-}
      AGENTYARD_KNOWLEDGE_EMBEDDING_API_KEY: ${AGENTYARD_KNOWLEDGE_EMBEDDING_API_KEY:-}
      AGENTYARD_KNOWLEDGE_EMBEDDING_DIMENSIONS: ${AGENTYARD_KNOWLEDGE_EMBEDDING_DIMENSIONS:-768}
      AGENTYARD_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${AGENTYARD_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-16}
      AGENTYARD_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${AGENTYARD_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-15}
      AGENTYARD_OBJECT_STORAGE_MODE: object-storage
      AGENTYARD_OBJECT_STORAGE_ROOT: ${AGENTYARD_OBJECT_STORAGE_ROOT:-/tmp/agentyard-knowledge}
      AGENTYARD_OBJECT_STORAGE_PROVIDER: minio
      AGENTYARD_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      AGENTYARD_OBJECT_STORAGE_REGION: ${AGENTYARD_OBJECT_STORAGE_REGION:-}
      AGENTYARD_OBJECT_STORAGE_ACCESS_KEY: ${AGENTYARD_OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      AGENTYARD_OBJECT_STORAGE_SECRET_KEY: ${AGENTYARD_OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      AGENTYARD_OBJECT_STORAGE_BUCKET: ${AGENTYARD_OBJECT_STORAGE_BUCKET:-agentyard-knowledge}
      AGENTYARD_OBJECT_STORAGE_CREATE_BUCKET: "true"
    networks:
      default:
        aliases:
          - knowledge-service-router
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started

  knowledge-service-2:
