x-python-package-index-build-args: &python-package-index-build-args
  - PIP_INDEX_URL
  - PIP_EXTRA_INDEX_URL
  - PIP_TRUSTED_HOST
  - UV_INDEX_URL
  - UV_EXTRA_INDEX_URL

services:
  postgres:
    image: ${LYNXUS_IMAGE_POSTGRES:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: lynxus
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-bootstrap:
    image: ${LYNXUS_IMAGE_POSTGRES_BOOTSTRAP:-postgres:17.6}
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      LYNXUS_CORE_DATABASE: lynxus_core
      LYNXUS_CHANNEL_GATEWAY_DATABASE: lynxus_channel_gateway
      LYNXUS_KNOWLEDGE_DATABASE: lynxus_knowledge
      LYNXUS_AGENT_RUNTIME_DATABASE: ${LYNXUS_AGENT_RUNTIME_DATABASE:-lynxus_agent_runtime}
    depends_on:
      - postgres
    volumes:
      - ../common/postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

  minio:
    image: ${LYNXUS_IMAGE_MINIO:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LYNXUS_OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LYNXUS_OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${LYNXUS_DEV_MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${LYNXUS_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: ${LYNXUS_IMAGE_REDIS:-redis:7.4-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${LYNXUS_REDIS_PASSWORD:-lynxus}
    environment:
      REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:-lynxus}
    ports:
      - "${LYNXUS_DEV_REDIS_BIND_ADDRESS:-127.0.0.1}:${LYNXUS_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: ${LYNXUS_IMAGE_TEMPORAL:-temporalio/auto-setup:1.28.1}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      POSTGRES_PWD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  temporal-ui:
    image: ${LYNXUS_IMAGE_TEMPORAL_UI:-temporalio/ui:2.39.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  temporal-ui-gateway:
    image: ${LYNXUS_IMAGE_CADDY:-caddy:2.8.4-alpine}
    restart: unless-stopped
    environment:
      LYNXUS_TEMPORAL_UI_USERNAME: ${LYNXUS_TEMPORAL_UI_USERNAME:-observer}
      LYNXUS_TEMPORAL_UI_PASSWORD: ${LYNXUS_TEMPORAL_UI_PASSWORD:-change-me-temporal-ui}
    command:
      - /bin/sh
      - -ec
      - |
        export LYNXUS_TEMPORAL_UI_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$LYNXUS_TEMPORAL_UI_PASSWORD")"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${LYNXUS_DEV_TEMPORAL_UI_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_DEV_TEMPORAL_UI_PORT:-8088}:8088"
    volumes:
      - ../common/temporal-ui-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - temporal-ui

  knowledge-service:
    build:
      context: ../..
      dockerfile: apps/knowledge-service/Dockerfile
      args: *python-package-index-build-args
    image: lynxus-knowledge-service:dev
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_KNOWLEDGE_INSTANCE_ID:-knowledge-service-1}
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_LOG_FORMAT: ${LYNXUS_LOG_FORMAT:-json}
      LYNXUS_KNOWLEDGE_DATABASE_URL: postgresql+psycopg://${SPRING_DATASOURCE_USERNAME:-lynxus}:${SPRING_DATASOURCE_PASSWORD:-lynxus}@postgres:5432/lynxus_knowledge
      LYNXUS_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE: ${LYNXUS_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE:-HYBRID}
      LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL: ${LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL:-}
      LYNXUS_KNOWLEDGE_EMBEDDING_MODEL: ${LYNXUS_KNOWLEDGE_EMBEDDING_MODEL:-}
      LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY: ${LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY:-}
      LYNXUS_KNOWLEDGE_EMBEDDING_DIMENSIONS: ${LYNXUS_KNOWLEDGE_EMBEDDING_DIMENSIONS:-768}
      LYNXUS_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${LYNXUS_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-16}
      LYNXUS_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${LYNXUS_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-15}
      LYNXUS_OBJECT_STORAGE_MODE: object-storage
      LYNXUS_OBJECT_STORAGE_ROOT: ${LYNXUS_OBJECT_STORAGE_ROOT:-/tmp/lynxus-knowledge}
      LYNXUS_OBJECT_STORAGE_PROVIDER: minio
      LYNXUS_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      LYNXUS_OBJECT_STORAGE_REGION: ${LYNXUS_OBJECT_STORAGE_REGION:-}
      LYNXUS_OBJECT_STORAGE_ACCESS_KEY: ${LYNXUS_OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      LYNXUS_OBJECT_STORAGE_SECRET_KEY: ${LYNXUS_OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      LYNXUS_OBJECT_STORAGE_BUCKET: ${LYNXUS_OBJECT_STORAGE_BUCKET:-lynxus-knowledge}
      LYNXUS_OBJECT_STORAGE_CREATE_BUCKET: "true"
    networks:
      default:
        aliases:
          - knowledge-service-router
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started

