  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: agentyard-worker:dev
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_WORKER_INSTANCE_ID:-worker-1}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      AGENTYARD_WORKER_PORT: 8081
      AGENTYARD_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentyard_core
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-agentyard}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-agentyard}
      AGENTYARD_REDIS_HOST: redis
      AGENTYARD_REDIS_PORT: 6379
      AGENTYARD_REDIS_DATABASE: ${AGENTYARD_REDIS_DATABASE:-0}
      AGENTYARD_REDIS_USERNAME: ${AGENTYARD_REDIS_USERNAME:-}
      AGENTYARD_REDIS_PASSWORD: ${AGENTYARD_REDIS_PASSWORD:-agentyard}
      AGENTYARD_REDIS_SSL_ENABLED: ${AGENTYARD_REDIS_SSL_ENABLED:-false}
      AGENTYARD_API_BASE_URL: http://api-router:8080/api
      AGENTYARD_AGENT_RUNTIME_BASE_URL: http://agent-runtime-router:8090
      AGENTYARD_SANDBOX_BASE_URL: http://sandbox:8080
      AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service-router:8091
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN}
      AGENTYARD_TEMPORAL_TARGET: temporal:7233
      AGENTYARD_TEMPORAL_NAMESPACE: ${AGENTYARD_TEMPORAL_NAMESPACE:-default}
      AGENTYARD_TEMPORAL_TASK_QUEUE: ${AGENTYARD_TEMPORAL_TASK_QUEUE:-agentyard-customer-ops}
      AGENTYARD_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${AGENTYARD_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
    depends_on:
      temporal:
        condition: service_started
      api:
        condition: service_started
      knowledge-service:
        condition: service_started
      agent-runtime:
        condition: service_started
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started

  worker-2:
    profiles: ["multi-instance"]
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: agentyard-worker:dev
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_WORKER_INSTANCE_ID_SECONDARY:-worker-2}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      AGENTYARD_WORKER_PORT: 8081
      AGENTYARD_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentyard_core
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-agentyard}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-agentyard}
      AGENTYARD_REDIS_HOST: redis
      AGENTYARD_REDIS_PORT: 6379
      AGENTYARD_REDIS_DATABASE: ${AGENTYARD_REDIS_DATABASE:-0}
      AGENTYARD_REDIS_USERNAME: ${AGENTYARD_REDIS_USERNAME:-}
      AGENTYARD_REDIS_PASSWORD: ${AGENTYARD_REDIS_PASSWORD:-agentyard}
      AGENTYARD_REDIS_SSL_ENABLED: ${AGENTYARD_REDIS_SSL_ENABLED:-false}
      AGENTYARD_API_BASE_URL: http://api-router:8080/api
      AGENTYARD_AGENT_RUNTIME_BASE_URL: http://agent-runtime-router:8090
      AGENTYARD_SANDBOX_BASE_URL: http://sandbox:8080
      AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service-router:8091
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN}
      AGENTYARD_TEMPORAL_TARGET: temporal:7233
      AGENTYARD_TEMPORAL_NAMESPACE: ${AGENTYARD_TEMPORAL_NAMESPACE:-default}
      AGENTYARD_TEMPORAL_TASK_QUEUE: ${AGENTYARD_TEMPORAL_TASK_QUEUE:-agentyard-customer-ops}
      AGENTYARD_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${AGENTYARD_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
    depends_on:
      temporal:
        condition: service_started
      api:
        condition: service_started
      knowledge-service:
        condition: service_started
      agent-runtime:
        condition: service_started
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${AGENTYARD_DEV_VITE_API_BASE_URL:-/api}
        VITE_DEPLOY_ENV: ${AGENTYARD_DEV_VITE_DEPLOY_ENV:-dev}
    image: agentyard-web:dev
    restart: unless-stopped
    ports:
      - "${AGENTYARD_DEV_WEB_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_DEV_WEB_PORT:-8080}:80"
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
