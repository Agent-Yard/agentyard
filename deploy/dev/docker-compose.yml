        required: false
      - path: ../../.env.dev.local
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LYNXUS_CHANNEL_GATEWAY_PORT: 8082
      LYNXUS_CHANNEL_GATEWAY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lynxus_channel_gateway
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-lynxus}
