name: lynxus-test-agent-runtime

services:
  agent-runtime:
    image: ${LYNXUS_IMAGE_AGENT_RUNTIME:?LYNXUS_IMAGE_AGENT_RUNTIME is required}
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_AGENT_RUNTIME_INSTANCE_ID:-agent-runtime-test-1}
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN:?LYNXUS_INTERNAL_AUTH_TOKEN is required}
      LYNXUS_LOG_FORMAT: ${LYNXUS_LOG_FORMAT:-json}
      LYNXUS_API_BASE_URL: ${LYNXUS_API_BASE_URL:?LYNXUS_API_BASE_URL is required}
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: ${LYNXUS_KNOWLEDGE_SERVICE_BASE_URL:?LYNXUS_KNOWLEDGE_SERVICE_BASE_URL is required}
      LYNXUS_REDIS_HOST: ${LYNXUS_REDIS_HOST:?LYNXUS_REDIS_HOST is required}
      LYNXUS_REDIS_PORT: ${LYNXUS_REDIS_PORT:-6379}
      LYNXUS_REDIS_DATABASE: ${LYNXUS_REDIS_DATABASE:-0}
      LYNXUS_REDIS_USERNAME: ${LYNXUS_REDIS_USERNAME:-}
      LYNXUS_REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:?LYNXUS_REDIS_PASSWORD is required}
      LYNXUS_REDIS_SSL_ENABLED: ${LYNXUS_REDIS_SSL_ENABLED:-true}
      LYNXUS_PRIVACY_SESSION_STORE_ENCRYPTION_KEY: ${LYNXUS_PRIVACY_SESSION_STORE_ENCRYPTION_KEY:?LYNXUS_PRIVACY_SESSION_STORE_ENCRYPTION_KEY is required}
      LYNXUS_PRIVACY_SESSION_STORE_KEY_PREFIX: ${LYNXUS_PRIVACY_SESSION_STORE_KEY_PREFIX:-lynxus:test:privacy:session}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      LYNXUS_OPENAI_COMPATIBLE_BASE_URL: ${LYNXUS_OPENAI_COMPATIBLE_BASE_URL:-}
      LYNXUS_OPENAI_COMPATIBLE_MODEL_ID: ${LYNXUS_OPENAI_COMPATIBLE_MODEL_ID:-}
      LYNXUS_OPENAI_COMPATIBLE_API_KEY_ENV_VAR: ${LYNXUS_OPENAI_COMPATIBLE_API_KEY_ENV_VAR:-OPENAI_COMPATIBLE_API_KEY}
      LYNXUS_OPENAI_COMPATIBLE_ORGANIZATION: ${LYNXUS_OPENAI_COMPATIBLE_ORGANIZATION:-}
      LYNXUS_OPENAI_COMPATIBLE_PROJECT: ${LYNXUS_OPENAI_COMPATIBLE_PROJECT:-}
      LYNXUS_OPENAI_COMPATIBLE_REGION: ${LYNXUS_OPENAI_COMPATIBLE_REGION:-test}
    ports:
      - "${LYNXUS_AGENT_RUNTIME_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_AGENT_RUNTIME_PORT:-8090}:8090"
