name: agentyard-test-agent-runtime

services:
  agent-runtime:
    image: ${AGENTYARD_IMAGE_AGENT_RUNTIME:?AGENTYARD_IMAGE_AGENT_RUNTIME is required}
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_AGENT_RUNTIME_INSTANCE_ID:-agent-runtime-test-1}
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN:?AGENTYARD_INTERNAL_AUTH_TOKEN is required}
      AGENTYARD_LOG_FORMAT: ${AGENTYARD_LOG_FORMAT:-json}
      AGENTYARD_API_BASE_URL: ${AGENTYARD_API_BASE_URL:?AGENTYARD_API_BASE_URL is required}
      AGENTYARD_CHANNEL_GATEWAY_BASE_URL: ${AGENTYARD_CHANNEL_GATEWAY_BASE_URL:?AGENTYARD_CHANNEL_GATEWAY_BASE_URL is required}
      AGENTYARD_AGENT_RUNTIME_BASE_URL: ${AGENTYARD_AGENT_RUNTIME_BASE_URL:?AGENTYARD_AGENT_RUNTIME_BASE_URL is required}
      AGENTYARD_AGENT_RUNTIME_DATABASE_URL: ${AGENTYARD_AGENT_RUNTIME_DATABASE_URL:?AGENTYARD_AGENT_RUNTIME_DATABASE_URL is required}
      AGENTYARD_AGENT_RUNTIME_ACTIVATION_LEASE_SECONDS: ${AGENTYARD_AGENT_RUNTIME_ACTIVATION_LEASE_SECONDS:-120}
      AGENTYARD_AGENT_RUNTIME_CONTEXT_WINDOW_MESSAGES: ${AGENTYARD_AGENT_RUNTIME_CONTEXT_WINDOW_MESSAGES:-160}
      AGENTYARD_AGENT_RUNTIME_CONTEXT_MAX_CHARS: ${AGENTYARD_AGENT_RUNTIME_CONTEXT_MAX_CHARS:-80000}
      AGENTYARD_AGENT_RUNTIME_RETENTION_SWEEP_LIMIT: ${AGENTYARD_AGENT_RUNTIME_RETENTION_SWEEP_LIMIT:-500}
      AGENTYARD_AGENT_RUNTIME_TRANSCRIPT_CACHE_TTL_SECONDS: ${AGENTYARD_AGENT_RUNTIME_TRANSCRIPT_CACHE_TTL_SECONDS:-3600}
      AGENTYARD_EXTENSION_REGISTRATION_FILE: ${AGENTYARD_EXTENSION_REGISTRATION_FILE:-}
      AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL: ${AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL:?AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL is required}
      AGENTYARD_REDIS_HOST: ${AGENTYARD_REDIS_HOST:?AGENTYARD_REDIS_HOST is required}
      AGENTYARD_REDIS_PORT: ${AGENTYARD_REDIS_PORT:-6379}
      AGENTYARD_REDIS_DATABASE: ${AGENTYARD_REDIS_DATABASE:-0}
      AGENTYARD_REDIS_USERNAME: ${AGENTYARD_REDIS_USERNAME:-}
      AGENTYARD_REDIS_PASSWORD: ${AGENTYARD_REDIS_PASSWORD:?AGENTYARD_REDIS_PASSWORD is required}
      AGENTYARD_REDIS_SSL_ENABLED: ${AGENTYARD_REDIS_SSL_ENABLED:-true}
      AGENTYARD_PRIVACY_SESSION_STORE_ENCRYPTION_KEY: ${AGENTYARD_PRIVACY_SESSION_STORE_ENCRYPTION_KEY:?AGENTYARD_PRIVACY_SESSION_STORE_ENCRYPTION_KEY is required}
      AGENTYARD_PRIVACY_SESSION_STORE_KEY_PREFIX: ${AGENTYARD_PRIVACY_SESSION_STORE_KEY_PREFIX:-agentyard:test:privacy:session}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      AGENTYARD_OPENAI_COMPATIBLE_ORGANIZATION: ${AGENTYARD_OPENAI_COMPATIBLE_ORGANIZATION:-}
      AGENTYARD_OPENAI_COMPATIBLE_PROJECT: ${AGENTYARD_OPENAI_COMPATIBLE_PROJECT:-}
    ports:
      - "${AGENTYARD_AGENT_RUNTIME_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_AGENT_RUNTIME_PORT:-8090}:8090"
