name: lynxus-test-temporal

services:
  temporal:
    image: ${LYNXUS_IMAGE_TEMPORAL:?LYNXUS_IMAGE_TEMPORAL is required}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: ${LYNXUS_TEMPORAL_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${LYNXUS_TEMPORAL_POSTGRES_USER:?LYNXUS_TEMPORAL_POSTGRES_USER is required}
      POSTGRES_PWD: ${LYNXUS_TEMPORAL_POSTGRES_PASSWORD:?LYNXUS_TEMPORAL_POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: ${LYNXUS_TEMPORAL_POSTGRES_HOST:?LYNXUS_TEMPORAL_POSTGRES_HOST is required}
      DBNAME: ${LYNXUS_TEMPORAL_DATABASE:-temporal}
      VISIBILITY_DBNAME: ${LYNXUS_TEMPORAL_VISIBILITY_DATABASE:-temporal_visibility}
    ports:
      - "${LYNXUS_TEMPORAL_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_TEMPORAL_PORT:-7233}:7233"
