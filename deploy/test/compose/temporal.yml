name: agentyard-test-temporal

services:
  temporal:
    image: ${AGENTYARD_IMAGE_TEMPORAL:?AGENTYARD_IMAGE_TEMPORAL is required}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: ${AGENTYARD_TEMPORAL_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${AGENTYARD_TEMPORAL_POSTGRES_USER:?AGENTYARD_TEMPORAL_POSTGRES_USER is required}
      POSTGRES_PWD: ${AGENTYARD_TEMPORAL_POSTGRES_PASSWORD:?AGENTYARD_TEMPORAL_POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: ${AGENTYARD_TEMPORAL_POSTGRES_HOST:?AGENTYARD_TEMPORAL_POSTGRES_HOST is required}
      DBNAME: ${AGENTYARD_TEMPORAL_DATABASE:-temporal}
      VISIBILITY_DBNAME: ${AGENTYARD_TEMPORAL_VISIBILITY_DATABASE:-temporal_visibility}
    ports:
      - "${AGENTYARD_TEMPORAL_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_TEMPORAL_PORT:-7233}:7233"
