name: agentyard-test-api

services:
  api:
    image: ${AGENTYARD_IMAGE_API:?AGENTYARD_IMAGE_API is required}
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_API_INSTANCE_ID:-api-test-1}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      AGENTYARD_API_PORT: 8080
      AGENTYARD_CORE_DATASOURCE_URL: ${AGENTYARD_CORE_DATASOURCE_URL:?AGENTYARD_CORE_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      AGENTYARD_REDIS_HOST: ${AGENTYARD_REDIS_HOST:?AGENTYARD_REDIS_HOST is required}
      AGENTYARD_REDIS_PORT: ${AGENTYARD_REDIS_PORT:-6379}
      AGENTYARD_REDIS_DATABASE: ${AGENTYARD_REDIS_DATABASE:-0}
      AGENTYARD_REDIS_USERNAME: ${AGENTYARD_REDIS_USERNAME:-}
      AGENTYARD_REDIS_PASSWORD: ${AGENTYARD_REDIS_PASSWORD:?AGENTYARD_REDIS_PASSWORD is required}
      AGENTYARD_REDIS_SSL_ENABLED: ${AGENTYARD_REDIS_SSL_ENABLED:-true}
      AGENTYARD_REDIS_TIMEOUT: ${AGENTYARD_REDIS_TIMEOUT:-3s}
      AGENTYARD_REDIS_HEALTH_CHECK_ENABLED: ${AGENTYARD_REDIS_HEALTH_CHECK_ENABLED:-true}
      AGENTYARD_REDIS_KEY_PREFIX: ${AGENTYARD_REDIS_KEY_PREFIX:-agentyard:test}
      AGENTYARD_SESSION_REDIS_NAMESPACE: ${AGENTYARD_SESSION_REDIS_NAMESPACE:-agentyard:test:session:http}
      AGENTYARD_SHARED_STATE_LOCK_TTL: ${AGENTYARD_SHARED_STATE_LOCK_TTL:-10s}
      AGENTYARD_SHARED_STATE_LOCK_ACQUIRE_TIMEOUT: ${AGENTYARD_SHARED_STATE_LOCK_ACQUIRE_TIMEOUT:-3s}
      AGENTYARD_SHARED_STATE_IDEMPOTENCY_TTL: ${AGENTYARD_SHARED_STATE_IDEMPOTENCY_TTL:-24h}
      AGENTYARD_SHARED_STATE_SSE_REPLAY_TTL: ${AGENTYARD_SHARED_STATE_SSE_REPLAY_TTL:-15m}
      AGENTYARD_SHARED_STATE_SSE_REPLAY_LIMIT: ${AGENTYARD_SHARED_STATE_SSE_REPLAY_LIMIT:-128}
      AGENTYARD_SHARED_STATE_STREAM_POLL_INTERVAL: ${AGENTYARD_SHARED_STATE_STREAM_POLL_INTERVAL:-1s}
      AGENTYARD_AUTH_BOOTSTRAP_USERNAME: ${AGENTYARD_AUTH_BOOTSTRAP_USERNAME:-admin}
      AGENTYARD_AUTH_DEFAULT_ROLE: ${AGENTYARD_AUTH_DEFAULT_ROLE:-BUSINESS_USER}
      AGENTYARD_AUTH_DEV_BOOTSTRAP_ENABLED: ${AGENTYARD_AUTH_DEV_BOOTSTRAP_ENABLED:-false}
      AGENTYARD_AUTH_LOGIN_SUCCESS_PATH: ${AGENTYARD_AUTH_LOGIN_SUCCESS_PATH:-/}
      AGENTYARD_SESSION_TIMEOUT: ${AGENTYARD_SESSION_TIMEOUT:-12h}
      AGENTYARD_SESSION_COOKIE_NAME: ${AGENTYARD_SESSION_COOKIE_NAME:-AGENTYARD_SESSION}
      AGENTYARD_SESSION_COOKIE_PATH: ${AGENTYARD_SESSION_COOKIE_PATH:-/}
      AGENTYARD_SESSION_COOKIE_SECURE: ${AGENTYARD_SESSION_COOKIE_SECURE:-true}
      AGENTYARD_SESSION_COOKIE_SAME_SITE: ${AGENTYARD_SESSION_COOKIE_SAME_SITE:-Lax}
      AGENTYARD_WEB_ALLOWED_ORIGINS: ${AGENTYARD_WEB_ALLOWED_ORIGINS:?AGENTYARD_WEB_ALLOWED_ORIGINS is required}
      AGENTYARD_CHANNEL_GATEWAY_BASE_URL: ${AGENTYARD_CHANNEL_GATEWAY_BASE_URL:?AGENTYARD_CHANNEL_GATEWAY_BASE_URL is required}
      AGENTYARD_AGENT_RUNTIME_BASE_URL: ${AGENTYARD_AGENT_RUNTIME_BASE_URL:?AGENTYARD_AGENT_RUNTIME_BASE_URL is required}
      AGENTYARD_EXTENSION_REGISTRATION_FILE: ${AGENTYARD_EXTENSION_REGISTRATION_FILE:-}
      AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL: ${AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL:?AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL is required}
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN:?AGENTYARD_INTERNAL_AUTH_TOKEN is required}
      AGENTYARD_INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ${AGENTYARD_INTEGRATION_CREDENTIAL_ENCRYPTION_KEY:?AGENTYARD_INTEGRATION_CREDENTIAL_ENCRYPTION_KEY is required}
      AGENTYARD_TEMPORAL_TARGET: ${AGENTYARD_TEMPORAL_TARGET:?AGENTYARD_TEMPORAL_TARGET is required}
      AGENTYARD_TEMPORAL_NAMESPACE: ${AGENTYARD_TEMPORAL_NAMESPACE:-agentyard-test}
      AGENTYARD_TEMPORAL_TASK_QUEUE: ${AGENTYARD_TEMPORAL_TASK_QUEUE:-agentyard-customer-ops-test}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_ID:?OIDC client id is required}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_SECRET:?OIDC client secret is required}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_SCOPE: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_SCOPE:-openid,profile,email}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_REDIRECT_URI: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_REDIRECT_URI:-{baseUrl}/login/oauth2/code/{registrationId}}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CORP_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CORP_ISSUER_URI:?OIDC issuer uri is required}
    ports:
      - "${AGENTYARD_API_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_API_PORT:-8080}:8080"
