name: lynxus-test-api

services:
  api:
    image: ${LYNXUS_IMAGE_API:?LYNXUS_IMAGE_API is required}
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_API_INSTANCE_ID:-api-test-1}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      LYNXUS_API_PORT: 8080
      LYNXUS_CORE_DATASOURCE_URL: ${LYNXUS_CORE_DATASOURCE_URL:?LYNXUS_CORE_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      LYNXUS_REDIS_HOST: ${LYNXUS_REDIS_HOST:?LYNXUS_REDIS_HOST is required}
      LYNXUS_REDIS_PORT: ${LYNXUS_REDIS_PORT:-6379}
      LYNXUS_REDIS_DATABASE: ${LYNXUS_REDIS_DATABASE:-0}
      LYNXUS_REDIS_USERNAME: ${LYNXUS_REDIS_USERNAME:-}
      LYNXUS_REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:?LYNXUS_REDIS_PASSWORD is required}
      LYNXUS_REDIS_SSL_ENABLED: ${LYNXUS_REDIS_SSL_ENABLED:-true}
      LYNXUS_REDIS_TIMEOUT: ${LYNXUS_REDIS_TIMEOUT:-3s}
      LYNXUS_REDIS_HEALTH_CHECK_ENABLED: ${LYNXUS_REDIS_HEALTH_CHECK_ENABLED:-true}
      LYNXUS_REDIS_KEY_PREFIX: ${LYNXUS_REDIS_KEY_PREFIX:-lynxus:test}
      LYNXUS_SESSION_REDIS_NAMESPACE: ${LYNXUS_SESSION_REDIS_NAMESPACE:-lynxus:test:session:http}
      LYNXUS_SHARED_STATE_LOCK_TTL: ${LYNXUS_SHARED_STATE_LOCK_TTL:-10s}
      LYNXUS_SHARED_STATE_LOCK_ACQUIRE_TIMEOUT: ${LYNXUS_SHARED_STATE_LOCK_ACQUIRE_TIMEOUT:-3s}
      LYNXUS_SHARED_STATE_IDEMPOTENCY_TTL: ${LYNXUS_SHARED_STATE_IDEMPOTENCY_TTL:-24h}
      LYNXUS_SHARED_STATE_SSE_REPLAY_TTL: ${LYNXUS_SHARED_STATE_SSE_REPLAY_TTL:-15m}
      LYNXUS_SHARED_STATE_SSE_REPLAY_LIMIT: ${LYNXUS_SHARED_STATE_SSE_REPLAY_LIMIT:-128}
      LYNXUS_SHARED_STATE_STREAM_POLL_INTERVAL: ${LYNXUS_SHARED_STATE_STREAM_POLL_INTERVAL:-1s}
      LYNXUS_AUTH_BOOTSTRAP_USERNAME: ${LYNXUS_AUTH_BOOTSTRAP_USERNAME:-admin}
      LYNXUS_AUTH_DEFAULT_ROLE: ${LYNXUS_AUTH_DEFAULT_ROLE:-BUSINESS_USER}
      LYNXUS_AUTH_DEV_BOOTSTRAP_ENABLED: ${LYNXUS_AUTH_DEV_BOOTSTRAP_ENABLED:-false}
      LYNXUS_AUTH_LOGIN_SUCCESS_PATH: ${LYNXUS_AUTH_LOGIN_SUCCESS_PATH:-/}
      LYNXUS_SESSION_TIMEOUT: ${LYNXUS_SESSION_TIMEOUT:-12h}
      LYNXUS_SESSION_COOKIE_NAME: ${LYNXUS_SESSION_COOKIE_NAME:-LYNXUS_SESSION}
      LYNXUS_SESSION_COOKIE_PATH: ${LYNXUS_SESSION_COOKIE_PATH:-/}
      LYNXUS_SESSION_COOKIE_SECURE: ${LYNXUS_SESSION_COOKIE_SECURE:-true}
      LYNXUS_SESSION_COOKIE_SAME_SITE: ${LYNXUS_SESSION_COOKIE_SAME_SITE:-Lax}
      LYNXUS_WEB_ALLOWED_ORIGINS: ${LYNXUS_WEB_ALLOWED_ORIGINS:?LYNXUS_WEB_ALLOWED_ORIGINS is required}
      LYNXUS_CHANNEL_GATEWAY_BASE_URL: ${LYNXUS_CHANNEL_GATEWAY_BASE_URL:?LYNXUS_CHANNEL_GATEWAY_BASE_URL is required}
      LYNXUS_AGENT_RUNTIME_BASE_URL: ${LYNXUS_AGENT_RUNTIME_BASE_URL:?LYNXUS_AGENT_RUNTIME_BASE_URL is required}
      LYNXUS_EXTENSION_REGISTRATION_FILE: ${LYNXUS_EXTENSION_REGISTRATION_FILE:-}
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: ${LYNXUS_KNOWLEDGE_SERVICE_BASE_URL:?LYNXUS_KNOWLEDGE_SERVICE_BASE_URL is required}
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN:?LYNXUS_INTERNAL_AUTH_TOKEN is required}
      LYNXUS_INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ${LYNXUS_INTEGRATION_CREDENTIAL_ENCRYPTION_KEY:?LYNXUS_INTEGRATION_CREDENTIAL_ENCRYPTION_KEY is required}
      LYNXUS_TEMPORAL_TARGET: ${LYNXUS_TEMPORAL_TARGET:?LYNXUS_TEMPORAL_TARGET is required}
      LYNXUS_TEMPORAL_NAMESPACE: ${LYNXUS_TEMPORAL_NAMESPACE:-lynxus-test}
      LYNXUS_TEMPORAL_TASK_QUEUE: ${LYNXUS_TEMPORAL_TASK_QUEUE:-lynxus-customer-ops-test}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_ID:?OIDC client id is required}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_CLIENT_SECRET:?OIDC client secret is required}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_SCOPE: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_SCOPE:-openid,profile,email}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_REDIRECT_URI: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CORP_REDIRECT_URI:-{baseUrl}/login/oauth2/code/{registrationId}}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CORP_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CORP_ISSUER_URI:?OIDC issuer uri is required}
    ports:
      - "${LYNXUS_API_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_API_PORT:-8080}:8080"
