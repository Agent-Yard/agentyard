name: lynxus-test-channel-gateway

services:
  channel-gateway:
    image: ${LYNXUS_IMAGE_CHANNEL_GATEWAY:?LYNXUS_IMAGE_CHANNEL_GATEWAY is required}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      LYNXUS_CHANNEL_GATEWAY_PORT: 8082
      LYNXUS_CHANNEL_GATEWAY_DATASOURCE_URL: ${LYNXUS_CHANNEL_GATEWAY_DATASOURCE_URL:?LYNXUS_CHANNEL_GATEWAY_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      LYNXUS_API_BASE_URL: ${LYNXUS_API_BASE_URL:?LYNXUS_API_BASE_URL is required}
      LYNXUS_CHANNEL_GATEWAY_BASE_URL: ${LYNXUS_CHANNEL_GATEWAY_BASE_URL:?LYNXUS_CHANNEL_GATEWAY_BASE_URL is required}
      LYNXUS_AGENT_RUNTIME_BASE_URL: ${LYNXUS_AGENT_RUNTIME_BASE_URL:?LYNXUS_AGENT_RUNTIME_BASE_URL is required}
      LYNXUS_REDIS_HOST: ${LYNXUS_REDIS_HOST:?LYNXUS_REDIS_HOST is required}
      LYNXUS_REDIS_PORT: ${LYNXUS_REDIS_PORT:-6379}
      LYNXUS_REDIS_DATABASE: ${LYNXUS_REDIS_DATABASE:-0}
      LYNXUS_REDIS_USERNAME: ${LYNXUS_REDIS_USERNAME:-}
      LYNXUS_REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:?LYNXUS_REDIS_PASSWORD is required}
      LYNXUS_REDIS_SSL_ENABLED: ${LYNXUS_REDIS_SSL_ENABLED:-true}
      LYNXUS_REDIS_TIMEOUT: ${LYNXUS_REDIS_TIMEOUT:-3s}
      LYNXUS_REDIS_KEY_PREFIX: ${LYNXUS_REDIS_KEY_PREFIX:-lynxus:test}
      LYNXUS_EXTENSION_REGISTRATION_FILE: ${LYNXUS_EXTENSION_REGISTRATION_FILE:-}
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN:?LYNXUS_INTERNAL_AUTH_TOKEN is required}
    ports:
      - "${LYNXUS_CHANNEL_GATEWAY_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_CHANNEL_GATEWAY_PORT:-8082}:8082"
