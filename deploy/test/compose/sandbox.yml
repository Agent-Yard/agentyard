name: agentyard-test-sandbox

services:
  sandbox:
    image: ${AGENTYARD_IMAGE_SANDBOX:?AGENTYARD_IMAGE_SANDBOX is required}
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ports:
      - "${AGENTYARD_SANDBOX_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_SANDBOX_PORT:-8092}:8080"
