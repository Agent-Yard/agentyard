name: agentyard-test-worker

services:
  worker:
    image: ${AGENTYARD_IMAGE_WORKER:?AGENTYARD_IMAGE_WORKER is required}
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_WORKER_INSTANCE_ID:-worker-test-1}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      AGENTYARD_WORKER_PORT: 8081
      AGENTYARD_CORE_DATASOURCE_URL: ${AGENTYARD_CORE_DATASOURCE_URL:?AGENTYARD_CORE_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      AGENTYARD_REDIS_HOST: ${AGENTYARD_REDIS_HOST:?AGENTYARD_REDIS_HOST is required}
      AGENTYARD_REDIS_PORT: ${AGENTYARD_REDIS_PORT:-6379}
      AGENTYARD_REDIS_DATABASE: ${AGENTYARD_REDIS_DATABASE:-0}
      AGENTYARD_REDIS_USERNAME: ${AGENTYARD_REDIS_USERNAME:-}
      AGENTYARD_REDIS_PASSWORD: ${AGENTYARD_REDIS_PASSWORD:?AGENTYARD_REDIS_PASSWORD is required}
      AGENTYARD_REDIS_SSL_ENABLED: ${AGENTYARD_REDIS_SSL_ENABLED:-true}
      AGENTYARD_REDIS_TIMEOUT: ${AGENTYARD_REDIS_TIMEOUT:-3s}
      AGENTYARD_REDIS_HEALTH_CHECK_ENABLED: ${AGENTYARD_REDIS_HEALTH_CHECK_ENABLED:-true}
      AGENTYARD_REDIS_KEY_PREFIX: ${AGENTYARD_REDIS_KEY_PREFIX:-agentyard:test}
      AGENTYARD_API_BASE_URL: ${AGENTYARD_API_BASE_URL:?AGENTYARD_API_BASE_URL is required}
      AGENTYARD_AGENT_RUNTIME_BASE_URL: ${AGENTYARD_AGENT_RUNTIME_BASE_URL:?AGENTYARD_AGENT_RUNTIME_BASE_URL is required}
      AGENTYARD_SANDBOX_BASE_URL: ${AGENTYARD_SANDBOX_BASE_URL:?AGENTYARD_SANDBOX_BASE_URL is required}
      AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL: ${AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL:?AGENTYARD_KNOWLEDGE_SERVICE_BASE_URL is required}
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN:?AGENTYARD_INTERNAL_AUTH_TOKEN is required}
      AGENTYARD_TEMPORAL_TARGET: ${AGENTYARD_TEMPORAL_TARGET:?AGENTYARD_TEMPORAL_TARGET is required}
      AGENTYARD_TEMPORAL_NAMESPACE: ${AGENTYARD_TEMPORAL_NAMESPACE:-agentyard-test}
      AGENTYARD_TEMPORAL_TASK_QUEUE: ${AGENTYARD_TEMPORAL_TASK_QUEUE:-agentyard-customer-ops-test}
      AGENTYARD_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${AGENTYARD_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
