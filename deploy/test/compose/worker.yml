name: lynxus-test-worker

services:
  worker:
    image: ${LYNXUS_IMAGE_WORKER:?LYNXUS_IMAGE_WORKER is required}
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_WORKER_INSTANCE_ID:-worker-test-1}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      LYNXUS_WORKER_PORT: 8081
      LYNXUS_CORE_DATASOURCE_URL: ${LYNXUS_CORE_DATASOURCE_URL:?LYNXUS_CORE_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      LYNXUS_REDIS_HOST: ${LYNXUS_REDIS_HOST:?LYNXUS_REDIS_HOST is required}
      LYNXUS_REDIS_PORT: ${LYNXUS_REDIS_PORT:-6379}
      LYNXUS_REDIS_DATABASE: ${LYNXUS_REDIS_DATABASE:-0}
      LYNXUS_REDIS_USERNAME: ${LYNXUS_REDIS_USERNAME:-}
      LYNXUS_REDIS_PASSWORD: ${LYNXUS_REDIS_PASSWORD:?LYNXUS_REDIS_PASSWORD is required}
      LYNXUS_REDIS_SSL_ENABLED: ${LYNXUS_REDIS_SSL_ENABLED:-true}
      LYNXUS_REDIS_TIMEOUT: ${LYNXUS_REDIS_TIMEOUT:-3s}
      LYNXUS_REDIS_HEALTH_CHECK_ENABLED: ${LYNXUS_REDIS_HEALTH_CHECK_ENABLED:-true}
      LYNXUS_REDIS_KEY_PREFIX: ${LYNXUS_REDIS_KEY_PREFIX:-lynxus:test}
      LYNXUS_WORKER_API_BASE_URL: ${LYNXUS_WORKER_API_BASE_URL:?LYNXUS_WORKER_API_BASE_URL is required}
      LYNXUS_AGENT_RUNTIME_BASE_URL: ${LYNXUS_AGENT_RUNTIME_BASE_URL:?LYNXUS_AGENT_RUNTIME_BASE_URL is required}
      LYNXUS_SANDBOX_BASE_URL: ${LYNXUS_SANDBOX_BASE_URL:?LYNXUS_SANDBOX_BASE_URL is required}
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: ${LYNXUS_KNOWLEDGE_SERVICE_BASE_URL:?LYNXUS_KNOWLEDGE_SERVICE_BASE_URL is required}
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN:?LYNXUS_INTERNAL_AUTH_TOKEN is required}
      LYNXUS_TEMPORAL_TARGET: ${LYNXUS_TEMPORAL_TARGET:?LYNXUS_TEMPORAL_TARGET is required}
      LYNXUS_TEMPORAL_NAMESPACE: ${LYNXUS_TEMPORAL_NAMESPACE:-lynxus-test}
      LYNXUS_TEMPORAL_TASK_QUEUE: ${LYNXUS_TEMPORAL_TASK_QUEUE:-lynxus-customer-ops-test}
      LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
