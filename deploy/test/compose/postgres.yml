name: agentyard-test-postgres

services:
  postgres:
    image: ${AGENTYARD_IMAGE_POSTGRES:?AGENTYARD_IMAGE_POSTGRES is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${AGENTYARD_POSTGRES_ADMIN_USER:?AGENTYARD_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${AGENTYARD_POSTGRES_ADMIN_PASSWORD:?AGENTYARD_POSTGRES_ADMIN_PASSWORD is required}
    ports:
      - "${AGENTYARD_POSTGRES_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d postgres
      interval: 5s
      timeout: 3s
      retries: 30

  postgres-bootstrap:
    image: ${AGENTYARD_IMAGE_POSTGRES_BOOTSTRAP:?AGENTYARD_IMAGE_POSTGRES_BOOTSTRAP is required}
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${AGENTYARD_POSTGRES_ADMIN_USER:?AGENTYARD_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${AGENTYARD_POSTGRES_ADMIN_PASSWORD:?AGENTYARD_POSTGRES_ADMIN_PASSWORD is required}
      AGENTYARD_APP_DATABASE_USER: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      AGENTYARD_APP_DATABASE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      AGENTYARD_TEMPORAL_DATABASE_USER: ${AGENTYARD_TEMPORAL_POSTGRES_USER:?AGENTYARD_TEMPORAL_POSTGRES_USER is required}
      AGENTYARD_TEMPORAL_DATABASE_PASSWORD: ${AGENTYARD_TEMPORAL_POSTGRES_PASSWORD:?AGENTYARD_TEMPORAL_POSTGRES_PASSWORD is required}
      AGENTYARD_CORE_DATABASE: ${AGENTYARD_CORE_DATABASE:-agentyard_core}
      AGENTYARD_CHANNEL_GATEWAY_DATABASE: ${AGENTYARD_CHANNEL_GATEWAY_DATABASE:-agentyard_channel_gateway}
      AGENTYARD_KNOWLEDGE_DATABASE: ${AGENTYARD_KNOWLEDGE_DATABASE:-agentyard_knowledge}
      AGENTYARD_AGENT_RUNTIME_DATABASE: ${AGENTYARD_AGENT_RUNTIME_DATABASE:-agentyard_agent_runtime}
      AGENTYARD_TEMPORAL_DATABASE: ${AGENTYARD_TEMPORAL_DATABASE:-temporal}
      AGENTYARD_TEMPORAL_VISIBILITY_DATABASE: ${AGENTYARD_TEMPORAL_VISIBILITY_DATABASE:-temporal_visibility}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../common/postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

volumes:
  postgres_data:
