name: agentyard-test-temporal-ui

services:
  temporal-ui:
    image: ${AGENTYARD_IMAGE_TEMPORAL_UI:?AGENTYARD_IMAGE_TEMPORAL_UI is required}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: ${AGENTYARD_TEMPORAL_UI_TARGET:?AGENTYARD_TEMPORAL_UI_TARGET is required}

  temporal-ui-gateway:
    image: ${AGENTYARD_IMAGE_CADDY:?AGENTYARD_IMAGE_CADDY is required}
    restart: unless-stopped
    environment:
      AGENTYARD_TEMPORAL_UI_USERNAME: ${AGENTYARD_TEMPORAL_UI_USERNAME:?AGENTYARD_TEMPORAL_UI_USERNAME is required}
      AGENTYARD_TEMPORAL_UI_PASSWORD: ${AGENTYARD_TEMPORAL_UI_PASSWORD:?AGENTYARD_TEMPORAL_UI_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - |
        export AGENTYARD_TEMPORAL_UI_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$AGENTYARD_TEMPORAL_UI_PASSWORD")"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${AGENTYARD_TEMPORAL_UI_BIND_ADDRESS:-127.0.0.1}:${AGENTYARD_TEMPORAL_UI_PORT:-8088}:8088"
    configs:
      - source: temporal_ui_gateway_caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - temporal-ui

configs:
  temporal_ui_gateway_caddyfile:
    content: |
      :8088 {
      	basicauth {
      		{$$AGENTYARD_TEMPORAL_UI_USERNAME} {$$AGENTYARD_TEMPORAL_UI_PASSWORD_HASH}
      	}

      	reverse_proxy temporal-ui:8080
      }
