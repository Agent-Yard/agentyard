name: lynxus-test-knowledge-service

services:
  knowledge-service:
    image: ${LYNXUS_IMAGE_KNOWLEDGE_SERVICE:?LYNXUS_IMAGE_KNOWLEDGE_SERVICE is required}
    restart: unless-stopped
    environment:
      LYNXUS_INSTANCE_ID: ${LYNXUS_KNOWLEDGE_INSTANCE_ID:-knowledge-service-test-1}
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN:?LYNXUS_INTERNAL_AUTH_TOKEN is required}
      LYNXUS_LOG_FORMAT: ${LYNXUS_LOG_FORMAT:-json}
      LYNXUS_KNOWLEDGE_DATABASE_URL: ${LYNXUS_KNOWLEDGE_DATABASE_URL:?LYNXUS_KNOWLEDGE_DATABASE_URL is required}
      LYNXUS_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE: ${LYNXUS_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE:-HYBRID}
      LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL: ${LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL:?LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL is required}
      LYNXUS_KNOWLEDGE_EMBEDDING_MODEL: ${LYNXUS_KNOWLEDGE_EMBEDDING_MODEL:?LYNXUS_KNOWLEDGE_EMBEDDING_MODEL is required}
      LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY: ${LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY:?LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY is required}
      LYNXUS_KNOWLEDGE_EMBEDDING_DIMENSIONS: ${LYNXUS_KNOWLEDGE_EMBEDDING_DIMENSIONS:-768}
      LYNXUS_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${LYNXUS_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-16}
      LYNXUS_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${LYNXUS_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-15}
      LYNXUS_KNOWLEDGE_URL_IMPORT_TIMEOUT_SECONDS: ${LYNXUS_KNOWLEDGE_URL_IMPORT_TIMEOUT_SECONDS:-15}
      LYNXUS_KNOWLEDGE_URL_IMPORT_USER_AGENT: ${LYNXUS_KNOWLEDGE_URL_IMPORT_USER_AGENT:-LynxusKnowledgeService/2.0}
      LYNXUS_OBJECT_STORAGE_MODE: object-storage
      LYNXUS_OBJECT_STORAGE_PROVIDER: ${LYNXUS_OBJECT_STORAGE_PROVIDER:-s3}
      LYNXUS_OBJECT_STORAGE_ENDPOINT: ${LYNXUS_OBJECT_STORAGE_ENDPOINT:?LYNXUS_OBJECT_STORAGE_ENDPOINT is required}
      LYNXUS_OBJECT_STORAGE_REGION: ${LYNXUS_OBJECT_STORAGE_REGION:?LYNXUS_OBJECT_STORAGE_REGION is required}
      LYNXUS_OBJECT_STORAGE_ACCESS_KEY: ${LYNXUS_OBJECT_STORAGE_ACCESS_KEY:?LYNXUS_OBJECT_STORAGE_ACCESS_KEY is required}
      LYNXUS_OBJECT_STORAGE_SECRET_KEY: ${LYNXUS_OBJECT_STORAGE_SECRET_KEY:?LYNXUS_OBJECT_STORAGE_SECRET_KEY is required}
      LYNXUS_OBJECT_STORAGE_BUCKET: ${LYNXUS_OBJECT_STORAGE_BUCKET:?LYNXUS_OBJECT_STORAGE_BUCKET is required}
      LYNXUS_OBJECT_STORAGE_CREATE_BUCKET: ${LYNXUS_OBJECT_STORAGE_CREATE_BUCKET:-false}
    ports:
      - "${LYNXUS_KNOWLEDGE_SERVICE_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_KNOWLEDGE_SERVICE_PORT:-8091}:8091"
