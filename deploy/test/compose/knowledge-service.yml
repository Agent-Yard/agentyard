name: agentyard-test-knowledge-service

services:
  knowledge-service:
    image: ${AGENTYARD_IMAGE_KNOWLEDGE_SERVICE:?AGENTYARD_IMAGE_KNOWLEDGE_SERVICE is required}
    restart: unless-stopped
    environment:
      AGENTYARD_INSTANCE_ID: ${AGENTYARD_KNOWLEDGE_INSTANCE_ID:-knowledge-service-test-1}
      AGENTYARD_INTERNAL_AUTH_TOKEN: ${AGENTYARD_INTERNAL_AUTH_TOKEN:?AGENTYARD_INTERNAL_AUTH_TOKEN is required}
      AGENTYARD_LOG_FORMAT: ${AGENTYARD_LOG_FORMAT:-json}
      AGENTYARD_KNOWLEDGE_DATABASE_URL: ${AGENTYARD_KNOWLEDGE_DATABASE_URL:?AGENTYARD_KNOWLEDGE_DATABASE_URL is required}
      AGENTYARD_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE: ${AGENTYARD_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE:-HYBRID}
      AGENTYARD_KNOWLEDGE_EMBEDDING_BASE_URL: ${AGENTYARD_KNOWLEDGE_EMBEDDING_BASE_URL:?AGENTYARD_KNOWLEDGE_EMBEDDING_BASE_URL is required}
      AGENTYARD_KNOWLEDGE_EMBEDDING_MODEL: ${AGENTYARD_KNOWLEDGE_EMBEDDING_MODEL:?AGENTYARD_KNOWLEDGE_EMBEDDING_MODEL is required}
      AGENTYARD_KNOWLEDGE_EMBEDDING_API_KEY: ${AGENTYARD_KNOWLEDGE_EMBEDDING_API_KEY:?AGENTYARD_KNOWLEDGE_EMBEDDING_API_KEY is required}
      AGENTYARD_KNOWLEDGE_EMBEDDING_DIMENSIONS: ${AGENTYARD_KNOWLEDGE_EMBEDDING_DIMENSIONS:-768}
      AGENTYARD_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${AGENTYARD_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-16}
      AGENTYARD_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${AGENTYARD_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-15}
      AGENTYARD_KNOWLEDGE_URL_IMPORT_TIMEOUT_SECONDS: ${AGENTYARD_KNOWLEDGE_URL_IMPORT_TIMEOUT_SECONDS:-15}
      AGENTYARD_KNOWLEDGE_URL_IMPORT_USER_AGENT: ${AGENTYARD_KNOWLEDGE_URL_IMPORT_USER_AGENT:-AgentYardKnowledgeService/2.0}
      AGENTYARD_OBJECT_STORAGE_MODE: object-storage
      AGENTYARD_OBJECT_STORAGE_PROVIDER: ${AGENTYARD_OBJECT_STORAGE_PROVIDER:-s3}
      AGENTYARD_OBJECT_STORAGE_ENDPOINT: ${AGENTYARD_OBJECT_STORAGE_ENDPOINT:?AGENTYARD_OBJECT_STORAGE_ENDPOINT is required}
      AGENTYARD_OBJECT_STORAGE_REGION: ${AGENTYARD_OBJECT_STORAGE_REGION:?AGENTYARD_OBJECT_STORAGE_REGION is required}
      AGENTYARD_OBJECT_STORAGE_ACCESS_KEY: ${AGENTYARD_OBJECT_STORAGE_ACCESS_KEY:?AGENTYARD_OBJECT_STORAGE_ACCESS_KEY is required}
      AGENTYARD_OBJECT_STORAGE_SECRET_KEY: ${AGENTYARD_OBJECT_STORAGE_SECRET_KEY:?AGENTYARD_OBJECT_STORAGE_SECRET_KEY is required}
      AGENTYARD_OBJECT_STORAGE_BUCKET: ${AGENTYARD_OBJECT_STORAGE_BUCKET:?AGENTYARD_OBJECT_STORAGE_BUCKET is required}
      AGENTYARD_OBJECT_STORAGE_CREATE_BUCKET: ${AGENTYARD_OBJECT_STORAGE_CREATE_BUCKET:-false}
    ports:
      - "${AGENTYARD_KNOWLEDGE_SERVICE_BIND_ADDRESS:-0.0.0.0}:${AGENTYARD_KNOWLEDGE_SERVICE_PORT:-8091}:8091"
