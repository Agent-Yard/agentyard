[project]
name = "lynxus-python-workspace"
version = "0.1.0"
description = "Python workspace for Lynxus services"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.28.5,<1",
    "jsonschema>=4.25.1,<5",
    "lynxus-agent-runtime",
    "pytest>=8.3.5,<9",
    "referencing>=0.36,<1",
]

[tool.uv]
package = false
constraint-dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.3",
    "uvicorn==0.34.0",
]

[tool.uv.workspace]
members = [
    "apps/agent-runtime",
    "apps/knowledge-service",
    "packages/extension-protocol",
    "packages/extension-sdk-python",
    "packages/python-common",
]

[tool.uv.sources]
lynxus-agent-runtime = { workspace = true }
lynxus-extension-protocol = { workspace = true }
lynxus-extension-sdk = { workspace = true }
lynxus-python-common = { workspace = true }
