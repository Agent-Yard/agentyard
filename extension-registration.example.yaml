# Complete operator extension registration example for AGENTYARD_EXTENSION_REGISTRATION_FILE.
#
# Core registrations are added automatically from AGENTYARD_CHANNEL_GATEWAY_BASE_URL and
# AGENTYARD_AGENT_RUNTIME_BASE_URL. Do not declare registrationId values that start with
# core- in this file.
#
# baseUrl must be http(s), without userinfo, query, or fragment. It may also be a
# full-value environment placeholder such as ${ACME_EXTENSION_URL}.

agentyard:
  extensions:
    services:
      - registrationId: acme-business-connectors
        baseUrl: http://127.0.0.1:18100
        exposes:
          channelProviderTypes: []
          toolConnectorTypes:
            - enterprise.acme.crm
            - enterprise.acme.erp
        auth:
          type: INTERNAL_TOKEN

      - registrationId: acme-channel-provider
        baseUrl: http://127.0.0.1:18101/agentyard
        exposes:
          channelProviderTypes:
            - enterprise.acme.internal-im
            - enterprise.acme.ticket
          toolConnectorTypes: []
        auth:
          type: INTERNAL_TOKEN

      - registrationId: acme-omnichannel-extension
        baseUrl: http://127.0.0.1:18102
        exposes:
          channelProviderTypes:
            - enterprise.acme.support-chat
          toolConnectorTypes:
            - enterprise.acme.customer-profile
        auth:
          type: INTERNAL_TOKEN
