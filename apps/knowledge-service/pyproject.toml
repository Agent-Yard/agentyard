[project]
name = "agentyard-knowledge-service"
version = "0.1.0"
description = "AgentYard knowledge base service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "agentyard-python-common",
    "minio==7.2.15",
    "psycopg[binary]==3.2.6",
    "pydantic",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "sqlalchemy==2.0.39",
    "structlog",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentyard_knowledge_service"]
