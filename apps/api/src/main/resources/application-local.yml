agentyard:
  auth:
    dev-bootstrap-enabled: true

logging:
  structured:
    format:
      console: ""
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId:-}/%X{spanId:-}] [%X{sessionId:-}/%X{workflowId:-}] [customer=%X{customerId:-} user=%X{userId:-}] [%thread] %logger{39} : %m%n%wEx"
