spring:
  application:
    name: lynxus-api
  docker:
    compose:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lynxus}
    username: ${SPRING_DATASOURCE_USERNAME:lynxus}
    password: ${SPRING_DATASOURCE_PASSWORD:lynxus}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${LYNXUS_API_PORT:8080}

lynxus:
  minio:
    endpoint: ${LYNXUS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${LYNXUS_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${LYNXUS_MINIO_SECRET_KEY:minioadmin}
  temporal:
    target: ${LYNXUS_TEMPORAL_TARGET:localhost:7233}
    namespace: ${LYNXUS_TEMPORAL_NAMESPACE:default}
    task-queue: ${LYNXUS_TEMPORAL_TASK_QUEUE:lynxus-knowledge-escalation}
