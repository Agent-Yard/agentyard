spring:
  application:
    name: lynxus-api
  docker:
    compose:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/lynxus_core}
    username: ${SPRING_DATASOURCE_USERNAME:lynxus}
    password: ${SPRING_DATASOURCE_PASSWORD:lynxus}
  data:
    redis:
      host: ${LYNXUS_REDIS_HOST:127.0.0.1}
      port: ${LYNXUS_REDIS_PORT:6379}
      database: ${LYNXUS_REDIS_DATABASE:0}
      username: ${LYNXUS_REDIS_USERNAME:}
      password: ${LYNXUS_REDIS_PASSWORD:lynxus}
      ssl:
        enabled: ${LYNXUS_REDIS_SSL_ENABLED:false}
      timeout: ${LYNXUS_REDIS_TIMEOUT:3s}
  session:
    redis:
      namespace: ${LYNXUS_SESSION_REDIS_NAMESPACE:lynxus:session:http}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
        prefix: ""
      add:
        service: ${spring.application.name}

server:
  port: ${LYNXUS_API_PORT:8080}
  servlet:
    session:
      timeout: ${LYNXUS_SESSION_TIMEOUT:12h}
      cookie:
        name: ${LYNXUS_SESSION_COOKIE_NAME:LYNXUS_SESSION}
        path: ${LYNXUS_SESSION_COOKIE_PATH:/}
        http-only: true
        secure: ${LYNXUS_SESSION_COOKIE_SECURE:false}
        same-site: ${LYNXUS_SESSION_COOKIE_SAME_SITE:Lax}

lynxus:
  auth:
    bootstrap:
      username: ${LYNXUS_AUTH_BOOTSTRAP_USERNAME:admin}
    default-role: ${LYNXUS_AUTH_DEFAULT_ROLE:BUSINESS_USER}
    dev-bootstrap-enabled: ${LYNXUS_AUTH_DEV_BOOTSTRAP_ENABLED:false}
    login-success-path: ${LYNXUS_AUTH_LOGIN_SUCCESS_PATH:/}
  minio:
    endpoint: ${LYNXUS_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${LYNXUS_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${LYNXUS_MINIO_SECRET_KEY:minioadmin}
  knowledge-service:
    base-url: ${LYNXUS_KNOWLEDGE_SERVICE_BASE_URL:http://127.0.0.1:8091}
  channel-gateway:
    base-url: ${LYNXUS_CHANNEL_GATEWAY_BASE_URL:http://127.0.0.1:8082}
  internal-auth:
    token: ${LYNXUS_INTERNAL_AUTH_TOKEN}
  redis:
    health-check-enabled: ${LYNXUS_REDIS_HEALTH_CHECK_ENABLED:true}
  shared-state:
    instance-id: ${LYNXUS_INSTANCE_ID:}
    lock-ttl: ${LYNXUS_SHARED_STATE_LOCK_TTL:10s}
    lock-acquire-timeout: ${LYNXUS_SHARED_STATE_LOCK_ACQUIRE_TIMEOUT:3s}
    idempotency-ttl: ${LYNXUS_SHARED_STATE_IDEMPOTENCY_TTL:24h}
    sse-replay-ttl: ${LYNXUS_SHARED_STATE_SSE_REPLAY_TTL:15m}
    sse-replay-limit: ${LYNXUS_SHARED_STATE_SSE_REPLAY_LIMIT:128}
    stream-poll-interval: ${LYNXUS_SHARED_STATE_STREAM_POLL_INTERVAL:1s}
  temporal:
    target: ${LYNXUS_TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: ${LYNXUS_TEMPORAL_NAMESPACE:default}
    task-queue: ${LYNXUS_TEMPORAL_TASK_QUEUE:lynxus-customer-ops}
    session-update-timeout: ${LYNXUS_TEMPORAL_SESSION_UPDATE_TIMEOUT:2m}
  web:
    allowed-origins: ${LYNXUS_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
