spring:
  application:
    name: lynxus-api
  docker:
    compose:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lynxus_api}
    username: ${SPRING_DATASOURCE_USERNAME:lynxus}
    password: ${SPRING_DATASOURCE_PASSWORD:lynxus}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${LYNXUS_API_PORT:8080}

lynxus:
  catalog:
    seed:
      enabled: ${LYNXUS_CATALOG_SEED_ENABLED:true}
  minio:
    endpoint: ${LYNXUS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${LYNXUS_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${LYNXUS_MINIO_SECRET_KEY:minioadmin}
  knowledge-service:
    base-url: ${LYNXUS_KNOWLEDGE_SERVICE_BASE_URL:http://localhost:8091}
  temporal:
    target: ${LYNXUS_TEMPORAL_TARGET:localhost:7233}
    namespace: ${LYNXUS_TEMPORAL_NAMESPACE:default}
    task-queue: ${LYNXUS_TEMPORAL_TASK_QUEUE:lynxus-customer-ops}
