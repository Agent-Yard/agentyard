spring:
  application:
    name: lynxus-worker

server:
  port: ${LYNXUS_WORKER_PORT:8081}

lynxus:
  agent-runtime:
    base-url: ${LYNXUS_AGENT_RUNTIME_BASE_URL:http://localhost:8090}
  knowledge-service:
    base-url: ${LYNXUS_KNOWLEDGE_SERVICE_BASE_URL:http://localhost:8091}
  temporal:
    target: ${LYNXUS_TEMPORAL_TARGET:localhost:7233}
    namespace: ${LYNXUS_TEMPORAL_NAMESPACE:default}
    task-queue: ${LYNXUS_TEMPORAL_TASK_QUEUE:lynxus-customer-ops}
    activity-start-to-close-timeout: ${LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:PT2M}
