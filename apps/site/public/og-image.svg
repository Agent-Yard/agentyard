    <path d="M22 18 V46 H46" stroke="#faf4e5" stroke-width="5" stroke-linecap="square" fill="none"/>
    <circle cx="54" cy="14" r="5" fill="#0d746e"/>
  </g>

  <text x="170" y="172" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#17211d">Lynxus</text>

  <text x="80" y="290" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#17211d">Governed Enterprise</text>
  <text x="80" y="370" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#17211d">Agent Platform.</text>

  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#5c6761">Release-driven · Session-first · Recoverable workflows</text>

  <g transform="translate(80,510)" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">
