spring:
  application:
    name: lynxus-channel-gateway
  docker:
    compose:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${LYNXUS_CHANNEL_GATEWAY_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/lynxus_channel_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:lynxus}
    password: ${SPRING_DATASOURCE_PASSWORD:lynxus}
  flyway:
    enabled: true
    table: channel_gateway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
        prefix: ""
      add:
        service: ${spring.application.name}

server:
  port: ${LYNXUS_CHANNEL_GATEWAY_PORT:8082}

lynxus:
  channel-gateway:
    base-url: ${LYNXUS_CHANNEL_GATEWAY_BASE_URL:http://127.0.0.1:8082}
  agent-runtime:
    base-url: ${LYNXUS_AGENT_RUNTIME_BASE_URL:http://127.0.0.1:8090}
  extensions:
    registration-file: ${LYNXUS_EXTENSION_REGISTRATION_FILE:}
  internal-auth:
    token: ${LYNXUS_INTERNAL_AUTH_TOKEN}
