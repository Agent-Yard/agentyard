[project]
name = "lynxus-agent-runtime"
version = "0.1.0"
description = "Lynxus Python execution runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx==0.28.1",
    "langgraph==0.2.53",
    "lynxus-python-common",
    "pydantic",
    "structlog",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lynxus_agent_runtime"]
