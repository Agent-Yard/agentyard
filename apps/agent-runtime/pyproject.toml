[project]
name = "lynxus-agent-runtime"
version = "0.1.0"
description = "Lynxus Python execution runtime"
requires-python = ">=3.11"
dependencies = [
    "cryptography==45.0.4",
    "fastapi",
    "httpx==0.28.1",
    "lynxus-extension-sdk",
    "lynxus-python-common",
    "pydantic",
    "redis[hiredis]==6.0.0",
    "structlog",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lynxus_agent_runtime"]

[tool.pytest.ini_options]
pythonpath = ["."]
