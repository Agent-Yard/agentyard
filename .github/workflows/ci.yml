name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run worker tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :apps:worker:test --no-daemon --console=plain --stacktrace &
          gradle_pid=$!
          (
            sleep 900
            if kill -0 "${gradle_pid}" 2>/dev/null; then
              echo "Gradle worker test step exceeded 15 minutes; dumping JVM state"
              ps -ef | grep -E '[j]ava|[g]radle' || true
              jps -lv || true
              for pid in $(jps | awk '{print $1}'); do
                echo "Thread dump for JVM ${pid}"
                jcmd "${pid}" Thread.print || true
              done
              kill -TERM "${gradle_pid}" || true
            fi
          ) &
          watchdog_pid=$!
          set +e
          wait "${gradle_pid}"
          status=$?
          set -e
          kill "${watchdog_pid}" 2>/dev/null || true
          wait "${watchdog_pid}" 2>/dev/null || true
          exit "${status}"

      - name: Run channel-gateway tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :apps:channel-gateway:test --no-daemon --console=plain --stacktrace &
          gradle_pid=$!
          (
            sleep 900
            if kill -0 "${gradle_pid}" 2>/dev/null; then
              echo "Gradle channel-gateway test step exceeded 15 minutes; dumping JVM state"
              ps -ef | grep -E '[j]ava|[g]radle' || true
              jps -lv || true
              for pid in $(jps | awk '{print $1}'); do
                echo "Thread dump for JVM ${pid}"
                jcmd "${pid}" Thread.print || true
              done
              kill -TERM "${gradle_pid}" || true
            fi
          ) &
          watchdog_pid=$!
          set +e
          wait "${gradle_pid}"
          status=$?
          set -e
          kill "${watchdog_pid}" 2>/dev/null || true
          wait "${watchdog_pid}" 2>/dev/null || true
          exit "${status}"

      - name: Run api tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :apps:api:test --no-daemon --console=plain --stacktrace &
          gradle_pid=$!
          (
            sleep 900
            if kill -0 "${gradle_pid}" 2>/dev/null; then
              echo "Gradle api test step exceeded 15 minutes; dumping JVM state"
              ps -ef | grep -E '[j]ava|[g]radle' || true
              jps -lv || true
              for pid in $(jps | awk '{print $1}'); do
                echo "Thread dump for JVM ${pid}"
                jcmd "${pid}" Thread.print || true
              done
              kill -TERM "${gradle_pid}" || true
            fi
          ) &
          watchdog_pid=$!
          set +e
          wait "${gradle_pid}"
          status=$?
          set -e
          kill "${watchdog_pid}" 2>/dev/null || true
          wait "${watchdog_pid}" 2>/dev/null || true
          exit "${status}"

      - name: Dump api test failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "API test result files:"
          find apps/api/build/test-results/test -maxdepth 1 -type f | sort || true
          echo
          echo "MultiInstanceApiIntegrationTest XML:"
          sed -n '1,260p' apps/api/build/test-results/test/TEST-com.agentyard.platform.session.MultiInstanceApiIntegrationTest.xml || true
          echo
          echo "API HTML report path:"
          ls -la apps/api/build/reports/tests/test || true

      - name: Verify jOOQ generated sources
        run: ./gradlew verifyJooqGenerated --no-daemon --console=plain --stacktrace

      - name: Run contracts check
        run: ./gradlew :packages:contracts-jvm:check --no-daemon --console=plain --stacktrace

  node:
    name: Node Lint And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:web

      - name: Build
        run: pnpm build

  python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run pytest
        run: uv run --all-packages pytest
