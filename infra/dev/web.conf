map $cookie_lynxus_api_instance $lynxus_api_origin {
    default api-router:8080;
    api-1 api:8080;
    api-2 api-2:8080;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=5s;

    root /usr/share/nginx/html;
    index index.html;

    location = /__dev/api-instance/api-1 {
        add_header Set-Cookie "lynxus_api_instance=api-1; Path=/; HttpOnly; SameSite=Lax";
        return 204;
    }

    location = /__dev/api-instance/api-2 {
        add_header Set-Cookie "lynxus_api_instance=api-2; Path=/; HttpOnly; SameSite=Lax";
        return 204;
    }

    location = /__dev/api-instance/reset {
        add_header Set-Cookie "lynxus_api_instance=deleted; Path=/; HttpOnly; SameSite=Lax; Max-Age=0";
        return 204;
    }

    location ~ ^/api/session-runtime/sessions/[^/]+/stream$ {
        proxy_pass http://$lynxus_api_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        add_header X-Lynxus-Api-Origin $lynxus_api_origin always;
    }

    location /api/ {
        proxy_pass http://$lynxus_api_origin/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Lynxus-Api-Origin $lynxus_api_origin always;
    }

    location /oauth2/ {
        proxy_pass http://$lynxus_api_origin/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Lynxus-Api-Origin $lynxus_api_origin always;
    }

    location /login/oauth2/ {
        proxy_pass http://$lynxus_api_origin/login/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Lynxus-Api-Origin $lynxus_api_origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
