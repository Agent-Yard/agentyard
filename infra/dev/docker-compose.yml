services:
  postgres:
    image: ${LYNXUS_IMAGE_POSTGRES:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: lynxus
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-bootstrap:
    image: ${LYNXUS_IMAGE_POSTGRES_BOOTSTRAP:-postgres:17.6}
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      LYNXUS_API_DATABASE: lynxus_api
      LYNXUS_KNOWLEDGE_DATABASE: lynxus_knowledge
    depends_on:
      - postgres
    volumes:
      - ../local/postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

  minio:
    image: ${LYNXUS_IMAGE_MINIO:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LYNXUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LYNXUS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${LYNXUS_DEV_MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${LYNXUS_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  temporal:
    image: ${LYNXUS_IMAGE_TEMPORAL:-temporalio/auto-setup:1.28.1}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      POSTGRES_PWD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  temporal-ui:
    image: ${LYNXUS_IMAGE_TEMPORAL_UI:-temporalio/ui:2.39.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  temporal-ui-gateway:
    image: ${LYNXUS_IMAGE_CADDY:-caddy:2.8.4-alpine}
    restart: unless-stopped
    environment:
      LYNXUS_TEMPORAL_UI_USERNAME: ${LYNXUS_TEMPORAL_UI_USERNAME:-observer}
      LYNXUS_TEMPORAL_UI_PASSWORD: ${LYNXUS_TEMPORAL_UI_PASSWORD:-change-me-temporal-ui}
    command:
      - /bin/sh
      - -ec
      - |
        export LYNXUS_TEMPORAL_UI_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$LYNXUS_TEMPORAL_UI_PASSWORD")"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${LYNXUS_DEV_TEMPORAL_UI_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_DEV_TEMPORAL_UI_PORT:-8088}:8088"
    volumes:
      - ../local/temporal-ui-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - temporal-ui

  knowledge-service:
    build:
      context: ../..
      dockerfile: apps/knowledge-service/Dockerfile
    image: lynxus-knowledge-service:dev
    restart: unless-stopped
    environment:
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_LOG_FORMAT: ${LYNXUS_LOG_FORMAT:-json}
      LYNXUS_KNOWLEDGE_DATABASE_URL: postgresql+psycopg://${SPRING_DATASOURCE_USERNAME:-lynxus}:${SPRING_DATASOURCE_PASSWORD:-lynxus}@postgres:5432/lynxus_knowledge
      LYNXUS_KNOWLEDGE_STORAGE_MODE: ${LYNXUS_KNOWLEDGE_STORAGE_MODE:-minio}
      LYNXUS_KNOWLEDGE_STORAGE_ROOT: ${LYNXUS_KNOWLEDGE_STORAGE_ROOT:-/tmp/lynxus-knowledge}
      LYNXUS_KNOWLEDGE_MINIO_BUCKET: ${LYNXUS_KNOWLEDGE_MINIO_BUCKET:-lynxus-knowledge}
      LYNXUS_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE: ${LYNXUS_KNOWLEDGE_DEFAULT_RETRIEVAL_MODE:-HYBRID}
      LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL: ${LYNXUS_KNOWLEDGE_EMBEDDING_BASE_URL:-}
      LYNXUS_KNOWLEDGE_EMBEDDING_MODEL: ${LYNXUS_KNOWLEDGE_EMBEDDING_MODEL:-}
      LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY: ${LYNXUS_KNOWLEDGE_EMBEDDING_API_KEY:-}
      LYNXUS_KNOWLEDGE_EMBEDDING_DIMENSIONS: ${LYNXUS_KNOWLEDGE_EMBEDDING_DIMENSIONS:-768}
      LYNXUS_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${LYNXUS_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-16}
      LYNXUS_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${LYNXUS_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-15}
      LYNXUS_MINIO_ENDPOINT: http://minio:9000
      LYNXUS_MINIO_ACCESS_KEY: ${LYNXUS_MINIO_ACCESS_KEY:-minioadmin}
      LYNXUS_MINIO_SECRET_KEY: ${LYNXUS_MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started

  agent-runtime:
    build:
      context: ../..
      dockerfile: apps/agent-runtime/Dockerfile
    image: lynxus-agent-runtime:dev
    restart: unless-stopped
    environment:
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_LOG_FORMAT: ${LYNXUS_LOG_FORMAT:-json}
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service:8091
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    depends_on:
      - knowledge-service

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: lynxus-api:dev
    restart: unless-stopped
    env_file:
      - path: ../../.env.dev
        required: false
      - path: ../../.env.dev.local
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LYNXUS_API_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lynxus_api
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-lynxus}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lynxus}
      LYNXUS_AUTH_BOOTSTRAP_USERNAME: ${LYNXUS_AUTH_BOOTSTRAP_USERNAME:-admin}
      LYNXUS_AUTH_DEFAULT_ROLE: ${LYNXUS_AUTH_DEFAULT_ROLE:-BUSINESS_USER}
      LYNXUS_AUTH_DEV_BOOTSTRAP_ENABLED: ${LYNXUS_AUTH_DEV_BOOTSTRAP_ENABLED:-true}
      LYNXUS_AUTH_LOGIN_SUCCESS_PATH: ${LYNXUS_AUTH_LOGIN_SUCCESS_PATH:-/}
      LYNXUS_WEB_ALLOWED_ORIGINS: ${LYNXUS_WEB_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LYNXUS_MINIO_ENDPOINT: http://minio:9000
      LYNXUS_MINIO_ACCESS_KEY: ${LYNXUS_MINIO_ACCESS_KEY:-minioadmin}
      LYNXUS_MINIO_SECRET_KEY: ${LYNXUS_MINIO_SECRET_KEY:-minioadmin}
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service:8091
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_TEMPORAL_TARGET: temporal:7233
      LYNXUS_TEMPORAL_NAMESPACE: ${LYNXUS_TEMPORAL_NAMESPACE:-default}
      LYNXUS_TEMPORAL_TASK_QUEUE: ${LYNXUS_TEMPORAL_TASK_QUEUE:-lynxus-customer-ops}
    ports:
      - "${LYNXUS_DEV_API_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_DEV_API_PORT:-18080}:8080"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      knowledge-service:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: lynxus-worker:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LYNXUS_WORKER_PORT: 8081
      LYNXUS_AGENT_RUNTIME_BASE_URL: http://agent-runtime:8090
      LYNXUS_KNOWLEDGE_SERVICE_BASE_URL: http://knowledge-service:8091
      LYNXUS_INTERNAL_AUTH_TOKEN: ${LYNXUS_INTERNAL_AUTH_TOKEN}
      LYNXUS_TEMPORAL_TARGET: temporal:7233
      LYNXUS_TEMPORAL_NAMESPACE: ${LYNXUS_TEMPORAL_NAMESPACE:-default}
      LYNXUS_TEMPORAL_TASK_QUEUE: ${LYNXUS_TEMPORAL_TASK_QUEUE:-lynxus-customer-ops}
      LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT: ${LYNXUS_TEMPORAL_ACTIVITY_START_TO_CLOSE_TIMEOUT:-PT2M}
    depends_on:
      temporal:
        condition: service_started
      knowledge-service:
        condition: service_started
      agent-runtime:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${LYNXUS_DEV_VITE_API_BASE_URL:-/api}
    image: lynxus-web:dev
    restart: unless-stopped
    ports:
      - "${LYNXUS_DEV_WEB_BIND_ADDRESS:-0.0.0.0}:${LYNXUS_DEV_WEB_PORT:-8080}:80"
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
