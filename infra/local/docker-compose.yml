services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: lynxus
      POSTGRES_USER: lynxus
      POSTGRES_PASSWORD: lynxus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-bootstrap:
    image: postgres:17.6
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: lynxus
      POSTGRES_PASSWORD: lynxus
      LYNXUS_API_DATABASE: lynxus_api
      LYNXUS_KNOWLEDGE_DATABASE: lynxus_knowledge
    depends_on:
      - postgres
    volumes:
      - ./postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      # OpenSearch 2.12+ validates the bootstrap admin password even when security is disabled.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Lynxus@2026Search!
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: lynxus
      POSTGRES_PWD: lynxus
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
