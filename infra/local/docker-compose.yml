services:
  postgres:
    image: ${LYNXUS_IMAGE_POSTGRES:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: lynxus
      POSTGRES_USER: lynxus
      POSTGRES_PASSWORD: lynxus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-bootstrap:
    image: ${LYNXUS_IMAGE_POSTGRES_BOOTSTRAP:-postgres:17.6}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: lynxus
      POSTGRES_PASSWORD: lynxus
      LYNXUS_API_DATABASE: lynxus_api
      LYNXUS_KNOWLEDGE_DATABASE: lynxus_knowledge
    depends_on:
      - postgres
    volumes:
      - ./postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

  minio:
    image: ${LYNXUS_IMAGE_MINIO:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  temporal:
    image: ${LYNXUS_IMAGE_TEMPORAL:-temporalio/auto-setup:1.28.1}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: lynxus
      POSTGRES_PWD: lynxus
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: ${LYNXUS_IMAGE_TEMPORAL_UI:-temporalio/ui:2.39.0}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  temporal-ui-gateway:
    image: ${LYNXUS_IMAGE_CADDY:-caddy:2.8.4-alpine}
    environment:
      LYNXUS_TEMPORAL_UI_USERNAME: ${LYNXUS_TEMPORAL_UI_USERNAME:-observer}
      LYNXUS_TEMPORAL_UI_PASSWORD: ${LYNXUS_TEMPORAL_UI_PASSWORD:-change-me-temporal-ui}
    command:
      - /bin/sh
      - -ec
      - |
        export LYNXUS_TEMPORAL_UI_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$LYNXUS_TEMPORAL_UI_PASSWORD")"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "0.0.0.0:8088:8088"
    volumes:
      - ./temporal-ui-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - temporal-ui

volumes:
  postgres_data:
  minio_data:
