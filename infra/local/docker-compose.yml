services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lynxus
      POSTGRES_USER: lynxus
      POSTGRES_PASSWORD: lynxus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-bootstrap:
    image: postgres:17.6
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: lynxus
      POSTGRES_PASSWORD: lynxus
      LYNXUS_API_DATABASE: lynxus_api
      LYNXUS_KNOWLEDGE_DATABASE: lynxus_knowledge
    depends_on:
      - postgres
    volumes:
      - ./postgres-bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - /bootstrap/init-databases.sh

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: lynxus
      POSTGRES_PWD: lynxus
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.39.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal

volumes:
  postgres_data:
  minio_data:
